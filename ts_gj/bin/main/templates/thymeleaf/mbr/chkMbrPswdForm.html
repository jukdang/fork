<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <th:block th:replace="/layout/head :: head"></th:block>
    <script th:src="@{/js/egovframework/pswdToggle.js}"></script>
</head>
<body>
	<!-- wrap : S -->
    <div class="wrap" id="wrap">
    <!-- 상단 헤더 -->
    <th:block th:replace="/layout/header :: top-menu"></th:block>
    
	    <!-- container : S -->
		<div id="container" class="scrollBar">
	        
		    <!-- 메인 컨텐츠 -->
		    <div class="contents member_update">
		    	<div class="wrapper">
		    	
		    		<div class="tit">
						<h1>비밀번호 확인</h1>
					</div>
			        <!-- 에러 메세지 alert 예시 -->
			        <script th:if="${errorMessage}" th:inline="javascript">
			        /*<![CDATA[*/
			        var errorMessage = /*[[${errorMessage}]]*/ '';
			        alert(errorMessage);
			        /*]]>*/
			        </script>
			        
			        <!-- 비밀번호 확인 폼 -->
			        <form th:action="@{/mbr/chkMbrPswd}" method="post">

<!-- 			                <logo id="logo" title="HOME">
			                    <a href="/main.do">
			                        <span>LOGO</span>
			                    </a>
			                </logo> -->
			                <div class="wh_box">
			                    
			                    <!-- 현재 로그인한 사용자 ID 표시(읽기 전용) -->
			                    <dl>
			                        <dt><label for="mbrId">아이디</label></dt>
			                        <dd><input type="text" id="mbrId" name="mbrId" th:value="${#authentication.name}" readonly></dd>
			                    </dl>
			                    
			                    <!-- 비밀번호 입력 -->
			                    <dl>
			                        <dt><label for="mbrPswd">비밀번호</label></dt>
			                        <dd>
				                        <div class="pass_input">
				                        	<input type="password" id="mbrPswd" name="mbrPswd" placeholder="비밀번호를 입력해주세요." autofocus>
										    <span class="icon_view">
										    <!-- 비밀번호 표시 -->
										    <i class="fa-regular fa-eye" style="display: none;" tabindex="0"></i>
										    <!-- 비밀번호 표시안함 -->
										    <i class="fa-regular fa-eye-slash" tabindex="0"></i>
										    </span>
									    </div>
								    </dd>
			                    </dl>
			                    
			                    <!-- 에러 메시지 -->
			                    <div th:if="${param.error}" class="alert alert-error">
			                        비밀번호가 일치하지 않습니다.
			                    </div>
			                    
			                    
			                </div>
			                
			                <div class="btn_area jfcenter">
		                        <a class="btn mid bd_blue" href="javascript:history.back()" title="취소">취소</a>
		                        <button class="btn mid blue" type="submit" title="확인">확인</button>
		                    </div>
			        </form>
			    </div>
		    </div>

	    </div>
	    <!-- container : E -->
	    
	    <!-- 푸터 -->
	    <th:block th:replace="/layout/footer :: footer-simple"></th:block>
    </div>
    <!-- wrap : E -->
    
</body>
<script>
$(function() {
    //모바일 반응형 체크
    if (isMobile()) {
        $($(".menu-trigger.mobile_btn")[0]).hide();
    }
});
</script>
</html>
