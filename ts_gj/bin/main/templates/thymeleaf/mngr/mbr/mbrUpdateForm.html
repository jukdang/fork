<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <th:block th:replace="/layout/head :: head-admin"></th:block>
    <script th:src="@{/js/egovframework/pswdToggle.js}"></script>
</head>
<body>
	<!-- wrap : S -->
    <div class="wrap admin" id="wrap">
	    <!-- 상단 헤더 -->
   		<th:block th:replace="/layout/header :: left-menu-admin"></th:block>
	    
	    	<!-- container : S -->
		<div id="container" class="scrollBar">
	       <!-- 메인 컨텐츠 -->
	       <div class="contents member_update">
				<div class="wrapper">
					<div class="tit_wrap">
						<h1>계정 수정</h1>
					</div>
			        <!-- 에러 메세지 alert 예시 -->
			        <script th:if="${errorMessage}" th:inline="javascript">
					/*<![CDATA[*/
					var errorMessage = /*[[${errorMessage}]]*/ '';
					if (errorMessage) {
					    alert(errorMessage);
					}
					/*]]>*/
					</script>
			        
			        <!-- 회원정보 수정 폼 -->
			        <form id="form" th:action="@{/mngr/mbr/mbrUpdate}" method="post" th:object="${mbrVO}">
						<input type="hidden" id="sn" name="sn" th:field="*{sn}">
		                <div class="wh_box">
		                    
		                    <!-- 아이디 (읽기 전용) -->
		                    <dl>
		                        <dt><label for="mbrId">아이디</label></dt>
		                        <dd><input type="text" id="mbrId" name="mbrId" th:field="*{mbrId}" readonly></dd>
		                    </dl>
		                    
		                    <!-- 이름 -->
		                    <dl>
		                        <dt><label for="mbrNm">이름</label></dt>
		                        <dd>
			                        <input type="text" id="mbrNm" name="mbrNm" th:field="*{mbrNm}" placeholder="이름을 입력해주세요.">
			                        <p class="error-message" th:if="${#fields.hasErrors('mbrNm')}" th:errors="*{mbrNm}"></p>
		                        </dd>
		                    </dl>
	                        <dl>
	                            <dt><label for="newPswd">새 비밀번호</label></dt>
	                            <dd>
			                        <div class="pass_input">
			                        	<input type="password" id="newPswd" name="newPswd" placeholder="새 비밀번호를 입력해주세요.">
									    <span class="icon_view">
									    <!-- 비밀번호 표시 -->
									    <i class="fa-regular fa-eye" style="display: none;"></i>
									    <!-- 비밀번호 표시안함 -->
									    <i class="fa-regular fa-eye-slash"></i>
									    </span>
								    </div>
							    </dd>
	                        </dl>
		                    <input type="hidden" id="mbrPswd" name="mbrPswd">
	                        <!-- 새 비밀번호 확인 -->
	                        <dl>
	                            <dt><label for="confirmPswd">새 비밀번호 확인</label></dt>
	                            <dd>
			                        <div class="pass_input">
			                        	<input type="password" id="confirmPswd" name="confirmPswd" placeholder="새 비밀번호를 다시 입력해주세요.">
									    <span class="icon_view">
									    <!-- 비밀번호 표시 -->
									    <i class="fa-regular fa-eye" style="display: none;"></i>
									    <!-- 비밀번호 표시안함 -->
									    <i class="fa-regular fa-eye-slash"></i>
									    </span>
								    </div>
							    </dd>
	                        </dl>
			            	<dl>
			            		<dt><label for="mbrRole">회원 역할<em class="point">*</em></label></dt>
			            		<dd>
							    	<div>
									    <select th:field="*{mbrRole}" class="form-control" id="mbrRole" onchange="toggleOwnrNm()">
									        <option th:if="${isAdmin}" value="ROLE_ADMIN">시스템 관리자</option>
									        <option value="ROLE_MANAGER">관리자</option>
									        <option value="ROLE_MECHANIC">정비사</option>
									    </select>
							    	</div>
							    	<div class="error" th:if="${#fields.hasErrors('mbrRole')}" th:errors="*{mbrRole}"></div>
						    	</dd>
						    </dl>
							<dl id="ownrNmSection" th:if="${isAdmin}">
			            		<dt><label for="ownrNm">소속<em class="point">*</em></label></dt>
			            		<dd>
							    	<div>
									    <select th:field="*{ownrNm}" class="form-control">
									    	<option value="">선택하세요</option>
									    	<option value="대원버스">대원버스</option>
									    	<option value="대진운수">대진운수</option>
									    	<option value="대창운수">대창운수</option>
									    	<option value="동화운수">동화운수</option>
									    	<option value="라정시내">라정시내</option>
									    	<option value="삼아교통">삼아교통</option>
									    	<option value="삼원운수">삼원운수</option>
									    	<option value="세영운수">세영운수</option>
									    	<option value="을로운수">을로운수</option>
									    	<option value="현대교통">현대교통</option>
									    </select>
								    </div>
						    	</dd>
						    </dl>
						    <div th:unless="${isAdmin}">
							    <input type="hidden" name="ownrNm" id="ownrNm" th:value="*{ownrNm}">
							</div>
		                </div>
		                
		                <!-- 버튼 영역 -->
		                <div class="button_area">
		                	<a class="btn mid grey" th:href="@{/mngr/mbr/mbrList}" title="취소">취소</a>
	                        <button class="btn mid mcolor" type="button" title="수정하기" id="modifyMbr">수정</button>
	                    </div>

			        </form>
			    </div>
		    </div>
		    
		    <!-- 푸터 -->
			<th:block th:replace="/layout/footer :: footer-simple"></th:block>
		</div>
		<!-- container : E -->
	</div>
	<!-- wrap : E -->
    
    <!-- 비밀번호 유효성 검사 스크립트 -->
    <script>
        // 폼 제출 전 유효성 검사
        $('#modifyMbr').on('click', function(e) {
       	    e.preventDefault(); // 폼 제출 막기
        	// 이메일 조합 처리
//             var emailId = document.getElementById('emailId').value.trim();
//             var emailDomain = document.getElementById('emailDomain').value.trim();
//             var emailFull = emailId && emailDomain ? emailId + '@' + emailDomain : '';

            // hidden 필드에 설정
//             document.getElementById('mbrEmail').value = emailFull;
        	
            // 새 비밀번호 입력 여부 확인
            var newPswd = document.getElementById('newPswd').value;
            var confirmPswd = document.getElementById('confirmPswd').value;
            
            // 새 비밀번호와 확인 비밀번호 일치 여부 확인
            if (newPswd && newPswd !== confirmPswd) {
                e.preventDefault(); // 폼 제출 중단
                alert('새 비밀번호와 확인 비밀번호가 일치하지 않습니다.');
                document.getElementById('confirmPswd').focus();
                return false;
            }
            
//             // 새 비밀번호와 확인 비밀번호 일치 여부 확인
//             if (newPswd.trim() == "") {
//                 alert('새 비밀번호를 입력해주세요.');
//                 document.getElementById('newPswd').focus();
//                 return false;
//             }
            
            //return true;
            $("#mbrPswd").val(newPswd);
            $("#form").submit();
            
        });
        
        document.addEventListener('DOMContentLoaded', function () {
        	toggleOwnrNm();
            const domainSelect = document.getElementById('domainSelect');
            const domainInput = document.getElementById('emailDomain');

            // 도메인 선택 시 자동 입력
            domainSelect.addEventListener('change', function () {
                domainInput.value = this.value;
            });

            // 폼 제출 전 이메일 조합
            document.querySelector('form').addEventListener('submit', function (e) {
                const emailId = document.getElementById('emailId').value.trim();
                const emailDomain = document.getElementById('emailDomain').value.trim();
                const mbrEmail = document.getElementById('mbrEmail');

                if (emailId && emailDomain) {
                    mbrEmail.value = `${emailId}@${emailDomain}`;
                } else {
                    alert('이메일 아이디와 도메인을 모두 입력해주세요.');
                    e.preventDefault();
                    return false;
                }

                // 기존 비밀번호 유효성 검사도 같이 실행됨
            });
        });
        
	    $("#mbrTelNo").on("input", function () {
	        let value = $(this).val();
	        // 숫자 이외 문자 제거
	        value = value.replace(/[^0-9]/g, "");
	        $(this).val(value);
	    });
	    
	    function toggleOwnrNm() {
    	   const mbrRole = document.getElementById('mbrRole').value;
    	   const ownrNmSection = document.getElementById('ownrNmSection');
    	   
    	   if (mbrRole === 'ROLE_ADMIN') {
    	       //ownrNmSection.style.display = 'none';
    	       $("#ownrNmSection").hide();
    	       // 시스템 관리자일 때 소속 값 초기화 (선택사항)
    	       $("#ownrNm").val('');
    	   } else {
    		   $("#ownrNmSection").show();
    	   }
    	}
    </script>
</body>
</html>
