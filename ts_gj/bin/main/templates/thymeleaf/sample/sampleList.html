<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <th:block th:replace="/layout/head :: head"></th:block>
    <!-- paging.js 별도 로드 -->
    <script type="text/javascript" th:src="@{/js/egovframework/paging.js}"></script>
    <script th:inline="javascript">
        var contextPath = $('#contextPathHolder').attr('data-contextPath') ? $('#contextPathHolder').attr('data-contextPath') : '';
        
        // AJAX 방식으로 페이징 처리하는 함수
        function searchData(pageIndex = 1) {
            console.log('=== searchData 호출 ===');
            console.log('pageIndex:', pageIndex);
            
            customFetch({
                url: contextPath + '/theimcSample/selectSampleList',
                method: 'GET', // 또는 type: 'GET'
                params: {  // GET 요청도 params 사용 가능!
                    pageIndex: pageIndex,
                    searchType: $('select[name="searchType"]').val(),
                    searchKeyword: $('input[name="searchKywd"]').val()
                },
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
//                 loadingId: 'wrap',
                onSuccess: function(response) {
                    if (response.status === 'SUCCESS') {
                        displayData(response.data);
                        if (typeof setPagination === 'function') {
                            setPagination('paging', 'searchData', response.data.paginationInfo);
                        }
                    }else if (response.status === 'FAIL') {
                    	console.log('오류가 발생했습니다.');
                    }
                },
                onError: function(error) {
                    console.error('에러 발생:', error);
                }
            });
        }

        function displayData(data) {
            const list = data.list || [];
            const paginationInfo = data.paginationInfo || {};
            
            // 총 건수 업데이트
            $('.stit_wrap em b').text(paginationInfo.totalRecordCount || 0);
            
            const tbody = $('table.tbl02 tbody');
            tbody.empty();
            
            if (list.length === 0) {
                tbody.append('<tr><td colspan="6" align="center">등록된 데이터가 없습니다.</td></tr>');
            } else {
                list.forEach(function(item, index) {
                    const rowNumber = (paginationInfo.totalRecordCount || 0) - 
                                    ((paginationInfo.currentPageNo - 1) * (paginationInfo.recordCountPerPage || 10)) - index;
                    
                    tbody.append(`
                        <tr onclick="sampleDetail('${item.id}')">
                            <td class="listtd">${rowNumber}</td>
                            <td class="listtd">${item.name || '-'}</td>
                            <td class="listtd">
                                <a class="list_tit" href="javascript:void(0)">${item.description || '-'}</a>
                            </td>
                            <td class="listtd">${item.regUser || '-'}</td>
                            <td class="listtd">${item.useYn === 'Y' ? '활성' : '비활성'}</td>
                            <td class="listtd">${item.id || '-'}</td>
                        </tr>
                    `);
                });
            }
        }
        
        // 샘플 상세 페이지로 이동하는 함수
        function sampleDetail(id) {
            location.href = contextPath + "/theimcSample/sampleDetail?id=" + id;
        }
    </script>
</head>
<body>
    <!-- wrap : S -->
    <div class="wrap" id="wrap">
        <!-- 상단 헤더 -->
        <th:block th:replace="/layout/header :: left-menu"></th:block>
   
        <!-- container : S -->
        <div id="container" class="scrollBar">
            <!-- 메인 컨텐츠 -->
            <div class="contents board">
                <div class="wrapper">
                
                    <div class="tit_wrap">
                        <h1>샘플 데이터</h1>
                    </div>
                    
                    <section class="board_list notice">
                        <!-- 검색 폼 (디자인만 사용, 서브밋 안함) -->
                        <div id="searchForm">
                            <div class="stit_wrap tit_search">
                                <div class="board_search">
                                    <select name="searchType">
                                        <option value="all">전체</option>
                                        <option value="name">이름</option>
                                        <option value="content">설명</option>
                                        <option value="author">등록자</option>
                                    </select>
                                    <div class="set_search">
                                        <input type="text" name="searchKywd" placeholder="검색어를 입력하세요.">
                                        <button type="button" class="btn mid mcolor" onclick="searchData(1);">검색</button>
                                    </div>
                                </div>
                                <em>총 <b>0</b>건</em>
                            </div>
                        </div>
                        
                        <div class="wh_box">
                            <div class="tbl_box scrollBar">
                                <table class="tbl02">
                                    <caption style="visibility:hidden">ID, 이름, 설명, 등록자, 사용여부, ID 표시하는 테이블</caption>
                                    <thead>
                                        <tr>
                                            <th class="w8p">No</th>
                                            <th class="w15p">이름</th>
                                            <th class="w35p">설명</th>
                                            <th class="w15p">등록자</th>
                                            <th class="w10p">사용여부</th>
                                            <th class="w17p">ID</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- 데이터가 여기에 동적으로 추가됩니다 -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        
                        <div class="tar mt20">
                        </div>
                        
                        <!-- Paging -->
                        <div id="paging">
                            <!-- setPagination()으로 동적 생성 -->
                        </div>
                    </section>
                </div>
            </div>

            <!-- 푸터 -->
            <th:block th:replace="/layout/footer :: footer-simple"></th:block>
    
        </div>
        <!-- container : E -->
    </div>
    <!-- wrap : E -->
</body>
<script>
    $(document).ready(function() {
        // 페이지 로드 지연 후 실행
        setTimeout(function() {
            searchData(1);
        }, 100);
    });
</script>
</html>
