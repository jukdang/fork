<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
	<th:block th:replace="/layout/head :: head"></th:block>
</head>
<body>
	<!-- wrap : S -->
    <div class="wrap" id="wrap">
    
        <!-- 상단 헤더 -->
        <div th:replace="/layout/header :: top-menu"></div>
	        
	    <!-- container : S -->
		<div id="container">
		 	<!-- 메인 컨텐츠 -->
		    <div class="contents">
				<!-- 채팅 첫화면 : S -->
				<form class="chat_form" id="chatForm" th:action="@{/vehicle/repairAssistCreateChat}" method="get">
			        <div class="chat_area">
			        	<div class="chat_body chat_first scrollBar">
		        			<div class="chat_wrapper">
		        				<div class="greeting">
									<h2>
										<i class="ai_icon"><img th:src="@{/images/egovframework/ai_icon_gj.svg}" alt="광주 AI 아이콘"></i>
										<span>안녕하세요, 정비사님</span>
									</h2>
									<!-- 채팅 입력 영역 HTML -->
									<div class="chat_input_area">
										<div class="chat_input">
											<!-- 스크린 리더용 라벨 -->
			    							<label for="regNoInput" class="sr-only">채팅 입력</label>
											<textarea class="scrollBar" id="regNoInput" name="regNoInput" maxlength="5000" rows="1" placeholder="차량번호 4자리를 입력해주세요. (예: 0000, 1234 등)"></textarea>
											<div class="chat_btn_area">
												<button type="submit" title="전송" class="chat_submit_btn scolor"><i class="fa-solid fa-arrow-right"></i></button>
											</div>
										</div>
										<ul class="dropdown" id="dropdown">
										</ul>
									</div>
									<th:block th:replace="/common/regNo :: regNo-search"></th:block>
								</div>
							</div>
		        		</div>
		        	</div>
		        <!-- 채팅 첫화면 : E -->
        		</form>
	        </div>

	    </div>
		<!-- container : E -->


		<!-- 푸터 -->
	    <th:block th:replace="/layout/footer :: footer-simple"></th:block>
	</div>
	<!-- wrap : E -->
	<script>
		document.addEventListener('DOMContentLoaded', function() {
		    const textarea = document.getElementById('regNoInput');
		    const form = document.getElementById('chatForm');
		    
		    textarea.addEventListener('keydown', function(e) {
		        // 엔터 키가 눌렸고, Shift 키가 함께 눌리지 않았을 때
		        if (e.key === 'Enter' && !e.shiftKey) {
		            e.preventDefault(); // 기본 동작(줄바꿈) 방지
		            
		            // 입력값이 있을 때만 서브밋
		            if (textarea.value.trim() !== '') {
		                form.submit();
		            }
		        }
		    });
		});
	</script>
			
</body>

</html>
