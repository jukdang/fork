<script>
	var sensorInfoData;
	var globalSensorKeyMap;
	$(document).ready(function() {
		setChckBkdnData();
		getSensorInfo() 
		$("#searchBtn").on("click", function() {
			setChckBkdnData();
		});
	});

	//센서 리스트 가져오기
	function getSensorInfo() {
	    const params = {
	    	vhclType: $("#vhclType").val()
	    };
	    customFetch({
	        url: '/vehicle/getSensorInfo',
	        method: 'POST',
	        params: params,
	        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
	        onSuccess: (response) => {
	            sensorInfoData = response.data.list;
				globalSensorKeyMap = createKeyMapFromSensorData(response.data.list);
				// 센서 정보 데이터에서 동적으로 keyMap 생성
				
	        },
	        onError: (error) => console.error('에러 발생:', error)
	    });
		
	}
	
	function createKeyMapFromSensorData(sensorData) {
	    const keyMap = {};
	    
	    sensorData.forEach(sensor => {
	        if (sensor.snsrCd && sensor.snsrNm) {
	            keyMap[sensor.snsrCd] = sensor.snsrNm;
	        }
	    });
	    return keyMap;
	}
	
	function setChckBkdnData(){
		var startDt = $("#startDt").val();
		var endDt = $("#endDt").val();
		var vhclSn = $("#vhclSn").val();
		
		customFetch({
	        url: '/vehicle/getDiagnosisHistResult',
	        method: 'POST',
	        params: {
	        	vhclSn : vhclSn,
	        	startDt : startDt,
	        	endDt : endDt,
	        },
	        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
	        onSuccess: (response) => {
	        	updateVehicleStats(response.data);
	        	
	        	// 고장코드 이력 테이블 업데이트
	            updateBkdnTable(response.data.bkdnList);
	            
	            // 진단 내역 테이블 업데이트
	            updateChckTable(response.data.chckList);
	        },
	        onError: (error) => console.error('에러:', error)
	    });
	}
	
	// 차량 상태 통계 업데이트 함수
	function updateVehicleStats(data) {
	    const bkdnList = data.bkdnList || [];
	    const chckList = data.chckList || [];
	    
	    // 운행거리 업데이트
	    let totalDistance = 0;
	    chckList.forEach(item => {
	        if (item.oprDstnc) {
	            totalDistance += parseInt(item.oprDstnc) || 0;
	        }
	    });
	    
	    if (totalDistance === 0 && chckList.length > 0) {
	        const distances = chckList.map(item => parseInt(item.oprDstnc) || 0);
	        totalDistance = Math.max(...distances);
	    }
	    
	    $('#drivingDistance').text(totalDistance > 0 ? totalDistance.toLocaleString() + 'km' : '-');
	    
	    // 고장코드 개수
	    $('#faultCount').text(bkdnList.length);
	    
	    // 경고발생 최다일자 계산
	    const dateCount = {};
	    chckList.forEach(item => {
	        if (item.chckStts === '2') {
	            const date = dayjs(item.bgngDt).format('YYYY-MM-DD');
	            dateCount[date] = (dateCount[date] || 0) + 1;
	        }
	    });
	    
	    let maxDate = '';
	    let maxCount = 0;
	    for (const date in dateCount) {
	        if (dateCount[date] > maxCount) {
	            maxCount = dateCount[date];
	            maxDate = date;
	        }
	    }
	    $('#maxWarningDate').text(maxDate || '-');
	    
	    // 총 경고 시간 계산
	    let totalWarningMinutes = 0;
	    chckList.forEach(item => {
	        if (item.chckStts === '2' && item.bgngDt && item.endDt) {
	            const start = dayjs(item.bgngDt);
	            const end = dayjs(item.endDt);
	            const minutes = end.diff(start, 'minute');
	            if (minutes > 0) {
	                totalWarningMinutes += minutes;
	            }
	        }
	    });
	    $('#totalWarningTime').text(totalWarningMinutes);
	    
	    // 총 주의 시간 계산
	    let totalCautionMinutes = 0;
	    chckList.forEach(item => {
	        if (item.chckStts === '1' && item.bgngDt && item.endDt) {
	            const start = dayjs(item.bgngDt);
	            const end = dayjs(item.endDt);
	            const minutes = end.diff(start, 'minute');
	            if (minutes > 0) {
	                totalCautionMinutes += minutes;
	            }
	        }
	    });
	    $('#totalCautionTime').text(totalCautionMinutes);
	    
	    // 최다 경고 센서 계산 (시간 기준)
	    const sensorTime = {};
	    chckList.forEach(item => {
	        if (item.chckStts === '2' && item.bgngDt && item.endDt) {
	            const start = dayjs(item.bgngDt);
	            const end = dayjs(item.endDt);
	            const seconds = end.diff(start, 'second');
	            if (seconds > 0) {
	                sensorTime[item.chckNm] = (sensorTime[item.chckNm] || 0) + seconds;
	            }
	        }
	    });
	    
	    let maxSensor = null;
	    let maxSensorTime = 0;
	    for (const sensor in sensorTime) {
	        if (sensorTime[sensor] > maxSensorTime) {
	            maxSensorTime = sensorTime[sensor];
	            maxSensor = sensor; // 센서 이름도 함께 저장
	        }
	    }
	    const maxSensorMinutes = maxSensorTime/60;
	    $('#maxWarningSensor').text(maxSensor ? `${maxSensor}` : '-');
	}
	
	// 고장코드 이력 테이블 업데이트 함수
	function updateBkdnTable(bkdnList) {
	    const tbody = $('#bkdnTableBody');
	    tbody.empty();
	    
	    if (!bkdnList || bkdnList.length === 0) {
	        tbody.append('<tr><td colspan="4"><p class="cont_none">이력이 없습니다.</p></td></tr>');
	        return;
	    }
	    
	    bkdnList.forEach(item => {
	        const ocrnDt = dayjs(item.ocrnDt).format('YYYY-MM-DD HH:mm:ss');
	        
	        const row = `
	            <tr>
	                <td>${item.sysNm || ''}</td>
	                <td>${item.dtc || ''}</td>
	                <td>${ocrnDt}</td>
	                <td>${item.msgCn || ''}</td>
	            </tr>
	        `;
	        tbody.append(row);
	    });
	}
	
	// 진단 내역 테이블 업데이트 함수
	function updateChckTable(chckList) {
	    const tbody = $('#chckTableBody');
	    tbody.empty();
	    
	    if (!chckList || chckList.length === 0) {
	        tbody.append('<tr><td colspan="5"><p class="cont_none">이력이 없습니다.</p></td></tr>');
	        return;
	    }
	    
	    chckList.forEach((item, index) => {
	        const bgngDt = dayjs(item.bgngDt).format('YYYY-MM-DD HH:mm:ss');
	        const endDt = dayjs(item.endDt).format('YYYY-MM-DD HH:mm:ss');
	        const periodText = `${bgngDt}<br/>~ ${endDt}`;
	        
	        // 상태에 따른 뱃지 클래스 결정
	        let statusBadge = '';
	        let statusText = '';
	        if (item.chckStts === '2') {
	            statusBadge = 'danger';
	            statusText = '경고';
	        } else if (item.chckStts === '1') {
	            statusBadge = 'warning';
	            statusText = '주의';
	        } else {
	            statusBadge = 'normal';
	            statusText = '정상';
	        }
	        
	        const chartDivId = `chartDiv${index+1}`;
	        
	        const row = `
	            <tr>
	                <td>${item.chckNm || ''}</td>
	                <td><span class="badge ${statusBadge}">${statusText}</span></td>
	                <td>${periodText}</td>
	                <td>
	                    ${item.msgCn ? item.msgCn.replace(/<br\/>/g, '<br/>') : ''}
	                </td>
	                <td>
	                	<button class="btn sm grey" 
		                	data-snsr-cd-list="${item.snsrCdList || ''}"
	                		data-chck-stts="${item.chckStts}"
		                	data-bgng-dt="${item.bgngDt}" 
		                	data-end-dt="${item.endDt}"
		                	data-chart-id="${chartDivId}">
		                	그래프<i class="fa-solid fa-angle-down"></i>
	                	</button>
                	</td>
	            </tr>
	            <tr class="graph_row" style="display: none;">
	                <td colspan="5">
	                    <div class="graph_box" style="height:350px;" id="${chartDivId}"></div>
	                </td>
	            </tr>
	        `;
	        tbody.append(row);
	    });
	    
	    // 그래프 버튼 클릭 이벤트 추가
	    $('.btn.sm.grey').off('click').on('click', function() {
	        const graphRow = $(this).closest('tr').next('.graph_row');
	        const sensorCdList = $(this).data("snsr-cd-list");
	        const chckStts = $(this).data('chck-stts');
	        const chartDivId = $(this).data('chart-id');  // ✅ 추가
	        const bgngDt = $(this).data('bgng-dt');
	        const endDt = $(this).data('end-dt');
	        
	        graphRow.toggle();
	        const icon = $(this).find('i');
	        if (graphRow.is(':visible')) {
	            icon.removeClass('fa-angle-down').addClass('fa-angle-up');
		        getSensorData(sensorCdList, bgngDt, endDt, chartDivId);
	        } else {
	            icon.removeClass('fa-angle-up').addClass('fa-angle-down');
	        }
	    });
	}
	
	function getSensorData(sensorCdList, startDtParam, endDtParam, chartDivId){
		const mtId = document.getElementById('mtId').value;
		const speedColkey = Object.keys(globalSensorKeyMap).find(key => key.includes('Speed'));
		const sensorCodes = sensorCdList + ',' + speedColkey + ',_time';
		const startDt = dayjs(startDtParam).format('HH:mm:ss');;
		const endDt = dayjs(endDtParam).format('HH:mm:ss');;
		const searchStartDt = dayjs(startDtParam).subtract(10, 'minute').toISOString();
		const searchEndDt = dayjs(endDtParam).add(10, 'minute').toISOString();

		const params = {
			influx_table: mtId,
			influx_column: sensorCodes,
			start_date_time: searchStartDt,
			end_date_time: searchEndDt
		};
		
		customFetch({
			url: '/influx/getSensorHistory',
			method: 'POST',
			params: params,
			headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
			loadingId: chartDivId,
			onSuccess: (response) => {
				function translateKeys(data) {
				    // 센서 데이터에서 keyMap 생성
				    return data.map(item => {
				        const newItem = {};
				        for (const [key, value] of Object.entries(item)) {
				            if (key === 'time') {
				                // "2025-08-25 14:30:01"에서 "14:30:01" 추출
				                newItem[key] = value.split(' ')[1];
				            } else {
				                // sensorKeyMap에서 찾아서 변환, 없으면 원래 키 사용
				                newItem[globalSensorKeyMap[key] || key] = value;
				            }
				        }
				        return newItem;
				    });
				}
				makeLineChart(chartDivId, translateKeys(response.result))
			    .then(() => {
			        // 빨간색 배경 영역 추가 (14:30:05부터 14:30:15까지)
			        addChartBackgroundRange(chartDivId, startDt, endDt, "#FF0000", 0.2);
			    });
			},
			onError: (error) => console.error('데이터 조회 에러:', error)
		});
	}
	
// 배경 영역 추가 함수
function addChartBackgroundRange(chartId, startCategory, endCategory, color = "#FF0000", opacity = 0.2) {
    const chartObj = globalChartInstances[chartId];
    if (!chartObj) return;
    
    const { chart, xAxis, processedData, root } = chartObj;
    
    // 시작과 끝 인덱스 찾기
    let startIndex = processedData.findIndex(item => item.category === startCategory);
    let endIndex = processedData.findIndex(item => item.category === endCategory);
    
    if (startIndex === -1 || endIndex === -1) return;
    
    // X축에 range 생성
    let rangeDataItem = xAxis.makeDataItem({
        category: startCategory,
        endCategory: endCategory
    });
    
    let range = xAxis.createAxisRange(rangeDataItem);
    
    // 배경 스타일 설정
    range.get("axisFill").setAll({
        fill: am5.color(color),
        fillOpacity: opacity,
        visible: true
    });
    
    range.get("grid").set("visible", false);
    range.get("label").set("visible", false);
    return range;
}
</script>
