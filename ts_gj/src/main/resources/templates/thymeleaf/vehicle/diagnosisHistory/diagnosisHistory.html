<script>
	$(document).ready(function() {
		getDiagnosisHistList();
		$("#searchBtn").on("click", function() {
			getDiagnosisHistList();
		});
		
		$('#diagnosisHistArea').on('click', 'li', function() {
	        // 클릭된 li의 data-vhcl-sn 값 가져오기
	        var vhclSn = $(this).data('vhcl-sn');
	        window.location.href = contextPath + `/vehicle/diagnosisHistoryResult?vhclSn=${vhclSn}`;
	    });
	});
	function getDiagnosisHistList(pageIndex = 1){
	    var ownrNm = $("#ownrSelect").val();
// 		var startDt = $("#startDt").val();
// 		var endDt = $("#endDt").val();
// 	    var order = $("#order").val();
		var regNo = $("#regNoInput").val();
	    customFetch({
	        url: '/vehicle/getDiagnosisHist',
	        method: 'POST',
	        params: {
	        	ownrNm : ownrNm,
	        	regNo : regNo,
// 	        	startDt : startDt,
// 	        	endDt : endDt,
	        	pageIndex : pageIndex
// 	        	order : order
	        },
	        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
	        onSuccess: (response) => {
	            var html = '';
	            $(".cont_none_wrap").hide();
	            $("#diagnosisHistArea").empty();
	            if (response && response.data && response.data.list) {
		            var data = response.data.list;
		            var fuelNm = '';
		            if(data.length > 0){
		            	for(const item of data){
		            		if(item.fuelCd == 'FU06'){
		            			fuelNm = 'CNG';
		            		}else if(item.fuelCd == 'FU02'){
		            			fuelNm = '경유';
		            		}else if(item.fuelCd == 'FU05'){
		            			fuelNm = '수소';
		            		}else if(item.fuelCd == 'FU04'){
		            			fuelNm = '전기';
		            		}else{
		            			fuelNm = item.fuelCd;
		            		}
		            		html += `<li data-vhcl-sn="${item.vhclSn}">
								<div class="vehicle_card safe" tabindex="0">
									<div class="vehicle_header">
										<strong class="vehicle_number">${vhclMasked(item.regNo)}</strong>
										<span class="badge safe">${fuelNm}</span>
									</div>
									<div class="vehicle_content">
										<dl>
											<dt>모델</dt>
											<dd>${item.mdlNm}</dd>
										</dl>
										<dl>
											<dt>연식</dt>
											<dd>${item.mdlYr}</dd>
										</dl>
									</div>
								</div>
							</li>`
		            	}
		            	$("#diagnosisHistArea").html(html);
		            	if (typeof setPagination === 'function') {
	                        setPagination('paging', 'getDiagnosisHistList', response.data.paginationInfo);
	                    }
		            }else{
		            	$(".cont_none_wrap").show();
		            	setPagination('paging', 'getDiagnosisHistList', response.data.paginationInfo);
		            }
	            }
	        },
	        onError: (error) => console.error('에러:', error)
	    });
	}
</script>
