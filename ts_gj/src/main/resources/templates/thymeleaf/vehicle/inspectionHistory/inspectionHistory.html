<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
	<th:block th:replace="/layout/head :: head"></th:block>
	<script type="text/javascript" th:src="@{/js/egovframework/paging.js}"></script>
</head>
<body>
	<!-- wrap : S -->
    <div class="wrap" id="wrap">
    
        <!-- 상단 헤더 -->
        <div th:replace="/layout/header :: top-menu"></div>
	        
	    <!-- container : S -->
		<div id="container">
		 	<!-- 메인 컨텐츠 -->
		    <div class="contents">
		    	<!-- 정기검사이력 : S -->
		        <div class="wrapper">
	                <div class="filter_area wh_box">
						<div class="filter_box_wrap">
							<div class="filter_box">
								<div th:replace="/common/ownrSelect :: ownr-select"></div>
				    		</div>
							<div class="filter_box">
                                <label for="regNoInput">차량번호</label>
                                <div class="filter_input_area">
                                    <input type="text" id="regNoInput" placeholder="예) 광주12가3456">
                                    <ul class="dropdown" id="dropdown" style="display:none;"></ul>
                                    <th:block th:replace="/common/regNo :: regNo-search"></th:block>
                                </div>
                            </div>
			    		</div>
			    		<button class="btn lg black btn_search" id="searchBtn">검색</button>
					</div>
					
					<div class="cont_section">
						<div class="wh_box">
		            		<div class="tbl_box">
					    		<table class="tbl01">
					    			<thead>
										<tr>
											<th class="w20p">No.</th>
											<th class="w24p">운수회사</th>
											<th>차량번호</th>
											<th class="w30p">상세 보기</th>
										</tr>
									</thead>
									<tbody id="inspectionHistArea">
									</tbody>
					    		</table>
					    	</div>
		            	</div>
	            	</div>
					<div class="paging" id="paging">
			    	</div>
	            </div>
	            <!-- 정기검사이력 : E -->
	        </div>

	    </div>
		<!-- container : E -->
		
		<!-- 푸터 -->
	    <th:block th:replace="/layout/footer :: footer-simple"></th:block>
	</div>
	<!-- wrap : E -->
	
	<script>
	$(document).ready(function() {
		getVehicleList();
		$("#searchBtn").on("click", function() {
			getVehicleList();
		});
		
		$('#inspectionHistArea').on('click', 'button', function() {
	        // 클릭된 li의 data-vhcl-sn 값 가져오기
	        var vhclSn = $(this).data('vhcl-sn');
	        window.location.href = contextPath + `/vehicle/inspectionHistoryResult?vhclSn=${vhclSn}`;
	    });
	});
	
	function getVehicleList(pageIndex = 1){
	    var ownrNm = $("#ownrSelect").val();
		var regNo = $("#regNoInput").val();
	    customFetch({
	        url: '/vehicle/getInspectionHist',
	        method: 'POST',
	        params: {
	        	ownrNm : ownrNm,
	        	regNo : regNo,
	        	pageIndex : pageIndex
	        },
	        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
	        onSuccess: (response) => {
	            var html = '';
	            if (response && response.data && response.data.list) {
		            var list = response.data.list;
		            const paginationInfo = response.data.paginationInfo
		            if(list.length > 0){
		            	list.forEach(function(item, index) {
			            	const rowNumber = (paginationInfo.totalRecordCount || 0) - 
	                        ((paginationInfo.currentPageNo - 1) * (paginationInfo.recordCountPerPage || 10)) - index;
			            	html += `<tr>
										<td>${rowNumber}</td>
										<td>${item.ownrNm}</td>
										<td>${item.regNo}</td>
										<td><button class="btn sm grey" data-vhcl-sn="${item.vhclSn}">검사이력 보기</button></td>
									</tr>`;
			            	if (typeof setPagination === 'function') {
		                        setPagination('paging', 'getVehicleList', response.data.paginationInfo);
		                    }
		            	});
						$("#inspectionHistArea").html(html);
		            }else{
		            	html += `<tr>
									<td colspan="4">조회결과가 없습니다.</td>
								</tr>`;
		            	$("#inspectionHistArea").html(html);
		            	setPagination('paging', 'getVehicleList', response.data.paginationInfo);
		            }
	            }
	        },
	        onError: (error) => console.error('에러:', error)
	    });
	}
	</script>
</body>
</html>
