<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
	<th:block th:replace="/layout/head :: head"></th:block>
</head>
<body>
	<div class="wrap" id="wrap">
		<!-- 헤더 -->
		<div th:replace="/layout/header :: top-menu"></div>

		<!-- 메인 컨텐츠 -->
		<div id="container" class="scrollBar">
			<div class="contents">
				<div class="wrapper">
					<div class="ai_diagnosis_detail">
						
						<!-- 차량 정보 및 AI 점수 영역 -->
						<div class="diagnosis_info wh_box">
							<div class="vehicle_info_wrap">
								<!-- 차량 정보 -->
								<div class="vehicle_info">
									<th:block th:switch="${vehicleInfo.vhclStts}">
										<em class="bus_round drive" th:case="'1'"><i class="fa-solid fa-bus-simple"></i></em>
										<em class="bus_round garage" th:case="'0'"><i class="fa-solid fa-bus-simple"></i></em>
									</th:block>
									
									<div class="vehicle_info_inner">
										<div class="info_tit">
											<em class="fuel_tit" th:switch="${vehicleInfo.fuelCd}">
												<span th:case="'FU06'" th:text="'CNG'"></span>
												<span th:case="'FU02'" th:text="'경유'"></span>
												<span th:case="'FU05'" th:text="'수소'"></span>
												<span th:case="'FU04'" th:text="'전기'"></span>
												<span th:case="*" th:text="${vehicleInfo.fuelCd}"></span>
											</em>
											<strong th:text="${@maskingUtils.maskVehicleRegNo(vehicleInfo.regNo)}"></strong>
											
											<input type="hidden" id="vhclSn" th:value="${vehicleInfo.vhclSn}">
											<input type="hidden" id="mtId" th:value="${vehicleInfo.mtId}">
											
											<th:block th:switch="${vehicleInfo.vhclStts}">
												<em class="status_text garage" th:case="'0'" th:text="'차고지'"></em>
												<em class="status_text drive" th:case="'1'" th:text="'운행중'"></em>
											</th:block>
										</div>
										
										<div class="info_content">
											<dl>
												<dt>모델/연식</dt>
												<dd th:text="|${vehicleInfo.mdlNm} ${vehicleInfo.mdlYr}|"></dd>
											</dl>
											<dl>
												<dt>운행거리</dt>
												<dd th:text="${vehicleInfo.oprDstnc} + 'km'"></dd>
											</dl>
										</div>
									</div>
								</div>
								
								<!-- 운행 정보 -->
								<div class="tooltip_container">
									<button class="btn mid white">운행정보 보기</button>
									<div class="tooltip_box" th:text="${@maskingUtils.maskDriverName(vehicleInfo.oprtrNm) != '' 
															       ? @maskingUtils.maskDriverName(vehicleInfo.oprtrNm) 
															       : '미확인'}">운전원명</div>
								</div>
							</div>
							
							<!-- AI 안전점수 -->
							<div class="score_area">
								<div class="ai_score_tit">
									<i class="ai_icon">
										<img th:src="@{/images/egovframework/ai_icon_gj.svg}" alt="광주 AI 아이콘">
									</i>
									<h3>AI 안전점수</h3>
								</div>
								
								<th:block th:if="${vehicleInfo.scr + 0 >= 60 && vehicleInfo.scr + 0 <= 70}">
									<p class="danger">안전점수는 <span><b th:text="${vehicleInfo.scr}"></b>점</span>으로 <span>정비가 시급합니다.</span></p>
								</th:block>
								<th:block th:if="${vehicleInfo.scr + 0 > 72 && vehicleInfo.scr + 0 <= 80}">
									<p class="warning">안전점수는 <span><b th:text="${vehicleInfo.scr}"></b>점</span>으로 <span>정비가 필요합니다.</span></p>
								</th:block>
								<th:block th:if="${vehicleInfo.scr + 0 > 84}">
									<p class="safe">안전점수는 <span><b th:text="${vehicleInfo.scr}"></b>점</span>으로 <span>안전합니다.</span></p>
								</th:block>
							</div>
						</div>

						<!-- 탭 메뉴 -->
						<ul class="tab01">
							<li class="on"><button>진단 결과</button></li>
							<li><button>진단 스캐너</button></li>
						</ul>

						<!-- 진단 결과 탭 -->
						<div class="diag_result tab_cont01">
							<div class="result_card_wrap">
								<h4>고장코드 발생내역</h4>
								<ul id="bkdnArea"></ul>
							</div>
							<div class="result_card_wrap">
								<h4>주의/경고 진단 결과</h4>
								<ul id="chckArea"></ul>
							</div>
						</div>

						<!-- 진단 스캐너 탭 -->
						<div class="diag_scanner tab_cont02" id="dataArea">
							<div class="wh_box w100p">
								<!-- 실시간 컨트롤 -->
								<div class="live_range_wrap">
									<button type="button" class="btn mid white" id="realTimeBtn">
										<i class="fa-solid fa-rotate-left"></i>실시간 <span>조회</span>
									</button>
									<div class="live_range">
										<span class="live_range_time">10:53:46</span>
										<!-- 스크린 리더용 라벨 -->
										<label for="rangeSlider" class="sr-only">종료일</label>
										<input type="range" min="0" max="10058" id="rangeSlider">
									</div>
								</div>

								<!-- 센서 데이터 테이블 -->
								<div class="tbl_box">
									<table class="tbl02">
										<thead>
											<tr>
												<th><button class="filter_btn" id="filterBtn" title="필터 팝업 열기"><i class="fa-solid fa-filter"></i></button>종류_센서명(단위)</th>
												<th class="w8p">센서값</th>
											</tr>
										</thead>
										<tbody id="sensorList">
											<th:block th:each="mainGroup : ${groupedSensors}">
												<!-- 메인 그룹 헤더 (sysNm) -->
												<tr tabindex="0" class="group-header main-group" th:data-group-name="${mainGroup.key}">
													<th colspan="2">
													    [[${mainGroup.key}]] <i class="fa-solid fa-angle-up toggle-icon"></i>
													</th>
												</tr>
												
												<th:block th:each="subGroup : ${mainGroup.value}">
													<!-- 서브그룹이 있는 경우 -->
													<th:block th:if="${subGroup.key != null}">
														<tr tabindex="0" class="group-header sub-group" th:data-parent-group="${mainGroup.key}" th:data-group-name="${subGroup.key}">
															<th colspan="2">
															    <i class="fa-solid fa-caret-right"></i> [[${subGroup.key}]] <i class="fa-solid fa-angle-up toggle-icon"></i>
															</th>
														</tr>
														
														<!-- 서브그룹 센서 행들 -->
														<tr th:each="sensor : ${subGroup.value}"
															class="sensor-row sensor_block_row"
															th:data-main-group="${mainGroup.key}"
															th:data-sub-group="${subGroup.key}"
															th:data-sensor-sn="${sensor.snsrSn}"
															th:data-sensor-cd="${sensor.snsrCd}"
															th:data-sys-nm="${sensor.sysNm}"
															th:data-sensor-nm="${sensor.snsrNm}"
															th:data-unit-nm="${sensor.unNm}"
															th:data-sensor-min="${sensor.snsrMin}"
															th:data-sensor-max="${sensor.snsrMax}"
															th:data-outlier-min="${sensor.outlierMin}"
															th:data-outlier-max="${sensor.outlierMax}"
															th:data-vw-min="${sensor.vwMin}"
															th:data-stts-type-yn="${sensor.sttsTypeYn}"
															th:data-vw-max="${sensor.vwMax}">
															<td>
																<div class="sensor_bar_wrap">
																	<span class="sensor_tit" th:text="${sensor.snsrNm} + 
										      						 			(${sensor.unNm != null and sensor.unNm != '' and sensor.unNm != ' '} 
										      						 			? ' (' + ${sensor.unNm} + ')' : '')">센서명</span>
																	<div class="sensor_bar_area">
																		<div class="sensor_bar" style="width: 0%;"></div>
																	</div>
																</div>
															</td>
															<td class="sensor-value"></td>
														</tr>
													</th:block>
													
													<!-- 서브그룹이 없는 경우 (직접 센서들) -->
													<th:block th:if="${subGroup.key == null}">
														<tr th:each="sensor : ${subGroup.value}"
															class="sensor-row"
															th:data-main-group="${mainGroup.key}"
															th:data-sub-group="${subGroup.key}"
															th:data-sensor-sn="${sensor.snsrSn}"
															th:data-sensor-cd="${sensor.snsrCd}"
															th:data-sys-nm="${sensor.sysNm}"
															th:data-sensor-nm="${sensor.snsrNm}"
															th:data-unit-nm="${sensor.unNm}"
															th:data-sensor-min="${sensor.snsrMin}"
															th:data-sensor-max="${sensor.snsrMax}"
															th:data-outlier-min="${sensor.outlierMin}"
															th:data-outlier-max="${sensor.outlierMax}"
															th:data-vw-min="${sensor.vwMin}"
															th:data-stts-type-yn="${sensor.sttsTypeYn}"
															th:data-vw-max="${sensor.vwMax}">
															<td>
																<div class="sensor_bar_wrap">
																	<span class="sensor_tit" th:text="${sensor.snsrNm} + 
										      						 			(${sensor.unNm != null and sensor.unNm != '' and sensor.unNm != ' '} 
										      						 			? ' (' + ${sensor.unNm} + ')' : '')">센서명</span>
																	<div class="sensor_bar_area">
																		<div class="sensor_bar" style="width: 0%;"></div>
																	</div>
																</div>
															</td>
															<td class="sensor-value"></td>
														</tr>
													</th:block>
												</th:block>
											</th:block>
										</tbody>
									</table>
								</div>
							</div>
						</div>

						<!-- 센서 필터 모달 -->
						<!-- 팝업 배경 -->
						<div class="popup_dim"></div>
						<div id="sensorModal" class="popup_wrap modal" style="display: none;">
							<div class="popup_header">
								<span>센서 표시 설정</span>
								<button class="popup_close" title="닫기"><i class="fa-solid fa-xmark"></i></button>
							</div>
							<div class="popup_body">
								<div class="popup_checkbox_area">
									<em class="all_check"><input type="radio" name="selRadio" id="selectAllBtn"><label for="selectAllBtn"><span></span>전체 선택</label></em>
									<em class="all_check"><input type="radio" name="selRadio" id="deselectAllBtn"><label for="deselectAllBtn"><span></span>전체 해제</label></em>
								</div>
								<div class="sensor_list" id="sensorCheckList">
									<th:block th:each="mainGroup : ${groupedSensors}">
										<div class="sensor-group list">
											<div class="group-header list_tit">
												<span th:text="${mainGroup.key}">시스템명</span>
											</div>
											<div class="sensor-items desc">
												<!-- 정렬된 서브그룹 처리 -->
												<th:block th:each="subGroup : ${mainGroup.value}">
													<!-- 서브그룹이 있는 경우 - 하나의 체크박스로 표시 -->
													<th:block th:if="${subGroup.key != null}">
														<div class="sensor-item">
															<input type="checkbox" th:id="'subgroup_' + ${mainGroup.key} + '_' + ${subGroup.key}"
																th:data-subgroup-sensors="${#strings.listJoin(subGroup.value.![snsrSn], ',')}" 
																class="subgroup-checkbox" checked>
															<label th:for="'subgroup_' + ${mainGroup.key} + '_' + ${subGroup.key}"
																th:text="${subGroup.key}">서브그룹명</label>
														</div>
													</th:block>
												</th:block>
												
												<!-- 서브그룹이 없는 센서들 (직접 센서들) - 마지막에 표시 -->
												<th:block th:each="subGroup : ${mainGroup.value}">
													<th:block th:if="${subGroup.key == null}">
														<div class="sensor-item" th:each="sensor : ${subGroup.value}">
															<input type="checkbox" th:id="'sensor_' + ${sensor.snsrSn}"
																th:data-sensor-sn="${sensor.snsrSn}" class="sensor-checkbox" checked>
															<label th:for="'sensor_' + ${sensor.snsrSn}"
																th:text="${sensor.snsrNm} + 
																 			(${sensor.unNm != null and sensor.unNm != '' and sensor.unNm != ' '} 
																 			? ' (' + ${sensor.unNm} + ')' : '')">센서명(단위)</label>
														</div>
													</th:block>
												</th:block>
											</div>
										</div>
									</th:block>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- 푸터 -->
		<th:block th:replace="/layout/footer :: footer-simple"></th:block>
	</div>

	<script>
		const VehicleDiagnosis = {
			// 데이터 관련
			sensorData: [],
			currentIndex: 0,
			isRealTimeMode: true,
			
			// 분할 로딩 관련 새 속성들
			totalHours: 12,           // 전체 조회할 시간 (3시간)
			loadedHours: 0.5,          // 초기 로딩 시간 (1시간)
			hourlyChunkSize: 0.5,      // 추가 로딩시 단위 (1시간씩)
			isLoadingMore: false,    // 추가 로딩 중 플래그
			baseEndTime: null,       // 기준 종료 시간
			
			// 인터벌 관리
			realTimeInterval: null,
			incrementalInterval: null,
			currentIncrementTime: null,
			
			// DOM 요소 캐시
			elements: {
				realTimeBtn: null,
				rangeSlider: null,
				timeDisplay: null,
				sensorList: null,
				modal: null
			},
			
			// 초기화
			init() {
				this.cacheElements();
				this.initTabs();
				this.initControls();
				this.initModal();
				this.initGroupToggle();
				this.initInitialCollapseState();
				this.loadDiagnosisData();
			},
			
			// DOM 요소 캐싱
			cacheElements() {
				this.elements = {
					realTimeBtn: document.getElementById('realTimeBtn'),
					rangeSlider: document.getElementById('rangeSlider'),
					timeDisplay: document.querySelector('.live_range_time'),
					sensorList: document.getElementById('sensorList'),
					modal: document.getElementById('sensorModal')
				};
			},
			
			// =====================================
			// 탭 기능
			// =====================================
			initTabs() {
				const tabButtons = document.querySelectorAll('.tab01 li');
				const contents = [
					document.querySelector('.tab_cont01'),
					document.querySelector('.tab_cont02')
				];
				
				tabButtons.forEach((tab, index) => {
					tab.addEventListener('click', () => {
						// 탭 활성화
						tabButtons.forEach(t => t.classList.remove('on'));
						tab.classList.add('on');
						
						// 센서 스캐너 탭 클릭시 데이터 로드
						if (index === 1) {
							this.loadSensorData();
						}
						
						// 콘텐츠 전환
						contents.forEach((content, i) => {
							content.style.display = (i === index) ? 'flex' : 'none';
						});
					});
				});
			},
			
			// =====================================
			// 컨트롤 기능
			// =====================================
			initControls() {
				// 실시간 버튼 - 수정된 부분
				this.elements.realTimeBtn?.addEventListener('click', () => {
					// 데이터가 있으면 슬라이더를 최대값으로 이동하고 실시간 모드 활성화
					if (this.sensorData.length > 0) {
						const lastIndex = this.sensorData.length - 1;
						this.elements.rangeSlider.value = lastIndex;
						this.updateDisplay(lastIndex);
						this.isRealTimeMode = true;
						this.startRealTimeUpdate();
					} else {
						// 데이터가 없을 때만 새로 로드
						this.loadSensorData();
					}
				});
				
				// 범위 슬라이더 - 수정된 부분
				this.elements.rangeSlider?.addEventListener('input', (e) => {
					const index = parseInt(e.target.value);
					
					// 슬라이더가 최소값(0)에 도달하고 아직 전체 데이터를 로드하지 않았다면
					if (index === 0 && this.loadedHours < this.totalHours && !this.isLoadingMore) {
						this.loadMoreHistoricalData();
					}
					
					this.updateDisplay(index);
					this.isRealTimeMode = false;
					this.stopRealTimeUpdate();
				});
			},
			
			// =====================================
			// 데이터 관리 - 수정된 부분
			// =====================================
			loadSensorData() {
				// 실시간 조회시 모든 상태 초기화
				this.stopRealTimeUpdate();
				this.sensorData = [];
				this.currentIndex = 0;
// 				this.loadedHours = 1;
				this.isLoadingMore = false;
				
				const now = new Date();
				this.baseEndTime = new Date(now.getTime() - (3 * 60 * 1000)); // 3분 전
				
				// 초기 1시간 데이터만 로드
				const startTime = new Date(this.baseEndTime.getTime() - (this.loadedHours * 60 * 60 * 1000));
				
				this.fetchInfluxData(startTime.toISOString(), this.baseEndTime.toISOString(), false);
			},
			
			// 과거 데이터 추가 로딩
			loadMoreHistoricalData() {
				if (this.isLoadingMore || this.loadedHours >= this.totalHours) {
					return;
				}
				
				this.isLoadingMore = true;
				
				// 로딩 표시
				this.showLoadingIndicator();
				
				// 추가로 로드할 시간 범위 계산
				const additionalHours = Math.min(this.hourlyChunkSize, this.totalHours - this.loadedHours);
				const endTime = new Date(this.baseEndTime.getTime() - (this.loadedHours * 60 * 60 * 1000));
				const startTime = new Date(endTime.getTime() - (additionalHours * 60 * 60 * 1000));
				
				console.log(`추가 데이터 로딩: ${additionalHours}시간 (${startTime.toISOString()} ~ ${endTime.toISOString()})`);
				
				this.fetchInfluxData(startTime.toISOString(), endTime.toISOString(), true);
			},
			
			fetchInfluxData(startDateTime, endDateTime, isAdditionalLoad = false) {
				const mtId = document.getElementById('mtId').value;
				const sensorCodes = this.getSensorCodes().join(',') + ',_time';
				
				const params = {
					influx_table: mtId,
					influx_column: sensorCodes,
					start_date_time: startDateTime,
					end_date_time: endDateTime
				};
				
				customFetch({
					url: '/influx/getSensorHistory',
					method: 'POST',
					params: params,
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
					loadingId: isAdditionalLoad ? null : 'dataArea', // 추가 로딩시에는 전체 로딩 표시 안함
					onSuccess: (response) => {
						const newData = response.result || [];
						
						if (isAdditionalLoad) {
							// 추가 데이터를 기존 데이터 앞에 삽입
							this.handleAdditionalDataLoad(newData);
						} else {
							// 초기 데이터 로드
							this.sensorData = newData;
							
							if (this.sensorData.length > 0) {
								this.updateRangeSlider();
								this.isRealTimeMode = true;
								this.startRealTimeUpdate();
								// 실시간 모드로 전환시 슬라이더를 최대값으로 설정
								const lastIndex = this.sensorData.length - 1;
								this.updateDisplay(lastIndex);
								this.elements.rangeSlider.value = lastIndex;
							} else {
								this.showNoDataMessage();
							}
						}
					},
					onError: (error) => {
						console.error('데이터 조회 에러:', error);
						if (isAdditionalLoad) {
							this.hideLoadingIndicator();
							this.isLoadingMore = false;
						}
					}
				});
			},
			
			// 추가 데이터 로드 처리
			handleAdditionalDataLoad(newData) {
				if (newData && newData.length > 0) {
					// 현재 표시중인 인덱스 저장
					const currentTime = this.sensorData[this.currentIndex]?.time;
					
					// 새 데이터를 기존 데이터 앞에 추가
					this.sensorData = [...newData, ...this.sensorData];
					
					// 로드된 시간 업데이트
					this.loadedHours += this.hourlyChunkSize;
					
					// 슬라이더 범위 업데이트
					this.updateRangeSlider();
					
					// 현재 위치 재계산 (시간 기준으로)
					if (currentTime) {
						const newIndex = this.sensorData.findIndex(data => data.time === currentTime);
						if (newIndex !== -1) {
							this.currentIndex = newIndex;
							this.elements.rangeSlider.value = newIndex;
							this.updateDisplay(newIndex);
						}
					}
					
					console.log(`추가 데이터 로드 완료. 전체 데이터: ${this.sensorData.length}개, 로드된 시간: ${this.loadedHours}시간`);
				}
				
				this.hideLoadingIndicator();
				this.isLoadingMore = false;
			},
			
			// 로딩 표시 함수들
			showLoadingIndicator() {
				toggleLoadings('dataArea',true);
			},
			
			hideLoadingIndicator() {
				toggleLoadings('dataArea',false);
			},
			
			getSensorCodes() {
				const sensorRows = document.querySelectorAll('#sensorList tr[data-sensor-cd]');
				const codes = [];
				
				sensorRows.forEach(row => {
					const code = row.dataset.sensorCd;
					if (code && code.trim()) {
						codes.push(code);
					}
				});
				
				return [...new Set(codes)];
			},
			
			// =====================================
			// 디스플레이 업데이트
			// =====================================
			updateDisplay(index) {
				if (!this.sensorData.length || index < 0 || index >= this.sensorData.length) return;
				
				const currentData = this.sensorData[index];
				this.currentIndex = index;
				
				this.updateTimeDisplay(currentData.time);
				this.updateSensorValues(currentData);
				
				if (!this.isRealTimeMode) {
					this.elements.rangeSlider.value = index;
				}
			},
			
			updateTimeDisplay(timeString) {
				if (this.elements.timeDisplay && timeString) {
					const date = new Date(timeString);
					this.elements.timeDisplay.textContent = date.toTimeString().split(' ')[0];
				}
			},
			
			updateSensorValues(data) {
				const sensorRows = document.querySelectorAll('#sensorList tr[data-sensor-cd]');
				sensorRows.forEach(row => {
					const sensorCd = row.dataset.sensorCd;
					const sttsTypeYn = row.dataset.sttsTypeYn;
					let value = data[sensorCd];
					
					if(sttsTypeYn == 'Y'){
						if(value == 1){
							value = 'on';
						}else{
							value = 'off';
						}
					}
					
					if (value !== undefined && value !== null) {
						this.updateSensorRow(row, value);
					}
				});
			},
			
			updateSensorRow(row, value) {
				const valueCell = row.querySelector('.sensor-value');
				const sensorBar = row.querySelector('.sensor_bar');
				
				if (valueCell) {
					const displayValue = (typeof value === 'number') ? value.toFixed(2) : value;
					valueCell.textContent = displayValue;
					
					if (sensorBar && typeof value === 'number') {
						this.updateSensorBar(row, value);
					}else {
						this.updateSttsSensorBar(row, value);
					} 
				}
			},
			
			updateSensorBar(row, value) {
				const sensorBar = row.querySelector('.sensor_bar');
				if (!sensorBar) return;
				
				const sensorMin = parseFloat(row.dataset.sensorMin) || 0;
				const sensorMax = parseFloat(row.dataset.sensorMax) || 100;
				const vwMin = parseFloat(row.dataset.vwMin);
				const vwMax = parseFloat(row.dataset.vwMax);
				const outlierMin = parseFloat(row.dataset.outlierMin);
				const outlierMax = parseFloat(row.dataset.outlierMax);
				const cautionStd = parseFloat(row.dataset.cautionStd);
				const warnStd = parseFloat(row.dataset.warnStd);
				const sttsTypeYn = row.dataset.sttsTypeYn;
				
				// 퍼센티지 계산
				let percentage;
				if (!isNaN(vwMin) && !isNaN(vwMax) && vwMax > vwMin) {
					percentage = Math.min(100, Math.max(0, ((value - vwMin) / (vwMax - vwMin)) * 100));
				} else {
					percentage = Math.min(100, Math.max(0, ((value - sensorMin) / (sensorMax - sensorMin)) * 100));
				}
				
				sensorBar.style.width = percentage + '%';
				
				// 상태별 색상 설정
				sensorBar.className = 'sensor_bar';
				if (!isNaN(outlierMin) && !isNaN(outlierMax)) {
					if (value < outlierMin || value > outlierMax) {
						sensorBar.classList.add('red');
					} else {
						sensorBar.classList.add('safe');
					}
				} else {
					if (warnStd && value >= warnStd) {
						sensorBar.classList.add('danger');
					} else if (cautionStd && value >= cautionStd) {
						sensorBar.classList.add('warning');
					} else {
						sensorBar.classList.add('safe');
					}
				}
			},
			
			updateSttsSensorBar(row, value) {
				const sensorBar = row.querySelector('.sensor_bar');
				if (!sensorBar) return;
				
				sensorBar.style.width = '100%';
				sensorBar.className = 'sensor_bar';
				sensorBar.classList.add(value);
			},
			
			updateRangeSlider() {
				if (this.elements.rangeSlider && this.sensorData.length > 0) {
					const newMax = this.sensorData.length - 1;
					this.elements.rangeSlider.max = newMax;
					this.elements.rangeSlider.min = 0;
					this.elements.rangeSlider.disabled = false;
					
					if (this.isRealTimeMode) {
						this.elements.rangeSlider.value = newMax;
						this.currentIndex = newMax;
					}
				}
			},
			
			showNoDataMessage() {
				if (this.elements.sensorList) {
					this.elements.sensorList.innerHTML = `
						<tr>
							<td colspan="2"><p class="data_none"><i class="fa-solid fa-circle-exclamation"></i>조회 결과가 없습니다.</p></td>
						</tr>
					`;
				}
				
				this.elements.rangeSlider.disabled = true;
				this.elements.realTimeBtn.disabled = true;
				this.elements.timeDisplay.textContent = '--:--:--';
				this.stopRealTimeUpdate();
			},
			
			// =====================================
			// 실시간 업데이트
			// =====================================
			startRealTimeUpdate() {
				this.stopRealTimeUpdate();
				this.startIncrementalUpdate();
				
				this.realTimeInterval = setInterval(() => {
					if (this.isRealTimeMode && this.sensorData.length > 0) {
						const lastIndex = this.sensorData.length - 1;
						this.updateDisplay(lastIndex);
						this.elements.rangeSlider.value = lastIndex;
					}
				}, 1000);
			},
			
			stopRealTimeUpdate() {
				if (this.realTimeInterval) {
					clearInterval(this.realTimeInterval);
					this.realTimeInterval = null;
				}
				this.stopIncrementalUpdate();
			},
			
			startIncrementalUpdate() {
				this.stopIncrementalUpdate();
				
				if (this.sensorData.length > 0) {
					const lastData = this.sensorData[this.sensorData.length - 1];
					const lastDataTime = new Date(lastData.time);
					this.currentIncrementTime = new Date(lastDataTime.getTime() + 1000);
					
					this.incrementalInterval = setInterval(() => {
						if (this.isRealTimeMode) {
							this.fetchIncrementalData();
							this.currentIncrementTime.setSeconds(this.currentIncrementTime.getSeconds() + 1);
						}
					}, 1000);
				}
			},
			
			stopIncrementalUpdate() {
				if (this.incrementalInterval) {
					clearInterval(this.incrementalInterval);
					this.incrementalInterval = null;
				}
			},
			
			fetchIncrementalData() {
				const mtId = document.getElementById('mtId').value;
				const sensorCodes = this.getSensorCodes().join(',') + ',_time';
				
				const startTime = new Date(this.currentIncrementTime);
				const endTime = new Date(this.currentIncrementTime.getTime() + 1000);
				
				const params = {
					influx_table: mtId,
					influx_column: sensorCodes,
					start_date_time: startTime.toISOString(),
					end_date_time: endTime.toISOString()
				};
				
				customFetch({
					url: '/influx/getSensorHistory',
					method: 'POST',
					params: params,
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
					onSuccess: (response) => {
						const newData = response.result || [];
						
						if (newData.length > 0) {
							this.sensorData.push(...newData);
							this.updateRangeSlider();
							this.updateDisplay(this.sensorData.length - 1);
						}
					},
					onError: (error) => console.error('증분 데이터 조회 에러:', error)
				});
			},
			
			// 나머지 함수들은 기존과 동일...
			// (진단 데이터 로드, 모달 관리, 그룹 토글 등)
			
			// =====================================
			// 그룹 토글 기능
			// =====================================
			initGroupToggle() {
				const groupHeaders = document.querySelectorAll('.group-header');
				
				groupHeaders.forEach(header => {
					const thElement = header.querySelector('th');
					header.style.cursor = 'pointer';
					header.addEventListener('click', () => this.toggleGroup(header));
				});
			},
			
			toggleGroup(headerRow) {
				const toggleIcon = headerRow.querySelector('.toggle-icon');
				const isMainGroup = headerRow.classList.contains('main-group');
				const isSubGroup = headerRow.classList.contains('sub-group');
				
				if (isMainGroup) {
					const groupName = headerRow.dataset.groupName;
					const subGroupHeaders = document.querySelectorAll(`#sensorList tr[data-parent-group="${groupName}"].sub-group`);
					
					const isCurrentlyExpanded = !toggleIcon || !toggleIcon.style.transform.includes('-180deg');
					
					if (isCurrentlyExpanded) {
						subGroupHeaders.forEach(subHeader => {
							subHeader.style.display = 'none';
						});
						
						const allSensorRows = document.querySelectorAll(`#sensorList tr[data-main-group="${groupName}"].sensor-row`);
						allSensorRows.forEach(row => {
							row.style.display = 'none';
						});
						
						if (toggleIcon) {
							toggleIcon.style.transform = 'rotate(-180deg)';
						}
					} else {
						subGroupHeaders.forEach(subHeader => {
							subHeader.style.display = '';
							
							const subGroupName = subHeader.dataset.groupName;
							const subgroupCheckbox = document.querySelector(`input[id*="subgroup_${groupName}_${subGroupName}"]`);
							
							if (subgroupCheckbox && subgroupCheckbox.checked) {
								const subSensorRows = document.querySelectorAll(`#sensorList tr[data-main-group="${groupName}"][data-sub-group="${subGroupName}"].sensor-row`);
								const subToggleIcon = subHeader.querySelector('.toggle-icon');
								const subIsExpanded = !subToggleIcon || !subToggleIcon.style.transform.includes('-180deg');
								
								subSensorRows.forEach(row => {
									row.style.display = subIsExpanded ? '' : 'none';
								});
							} else {
								const subSensorRows = document.querySelectorAll(`#sensorList tr[data-main-group="${groupName}"][data-sub-group="${subGroupName}"].sensor-row`);
								subSensorRows.forEach(row => {
									row.style.display = 'none';
								});
							}
						});
						
						const allMainGroupSensors = document.querySelectorAll(`#sensorList tr[data-main-group="${groupName}"].sensor-row`);
						const directSensorRows = Array.from(allMainGroupSensors).filter(row => {
							const subGroup = row.dataset.subGroup;
							return !subGroup || subGroup === 'null' || subGroup.trim() === '';
						});
						
						directSensorRows.forEach(row => {
							const sensorSn = row.dataset.sensorSn;
							const sensorCheckbox = document.querySelector(`input[data-sensor-sn="${sensorSn}"]`);
							
							if (sensorCheckbox && sensorCheckbox.checked) {
								row.style.display = '';
							} else {
								row.style.display = 'none';
							}
						});
						
						if (toggleIcon) {
							toggleIcon.style.transform = 'rotate(0deg)';
						}
					}
				} else if (isSubGroup) {
					const parentGroup = headerRow.dataset.parentGroup;
					const groupName = headerRow.dataset.groupName;
					const sensorRows = document.querySelectorAll(`#sensorList tr[data-main-group="${parentGroup}"][data-sub-group="${groupName}"].sensor-row`);
					
					if (sensorRows.length === 0) return;
					
					const isVisible = sensorRows[0].style.display !== 'none';
					const subgroupCheckbox = document.querySelector(`input[id*="subgroup_${parentGroup}_${groupName}"]`);
					
					sensorRows.forEach(row => {
						if (subgroupCheckbox && subgroupCheckbox.checked) {
							row.style.display = isVisible ? 'none' : '';
						} else {
							row.style.display = 'none';
						}
					});
					
					if (toggleIcon) {
						toggleIcon.style.transform = isVisible ? 'rotate(-180deg)' : 'rotate(0deg)';
					}
				}
			},
			
			initInitialCollapseState() {
				const subGroupHeaders = document.querySelectorAll('#sensorList tr.sub-group');
				
				subGroupHeaders.forEach(subHeader => {
					const parentGroup = subHeader.dataset.parentGroup;
					const groupName = subHeader.dataset.groupName;
					const toggleIcon = subHeader.querySelector('.toggle-icon');
					
					const sensorRows = document.querySelectorAll(`#sensorList tr[data-main-group="${parentGroup}"][data-sub-group="${groupName}"].sensor-row`);
					
					sensorRows.forEach(row => {
						row.style.display = 'none';
					});
					
					if (toggleIcon) {
						toggleIcon.style.transform = 'rotate(-180deg)';
					}
				});
			},
			
			// =====================================
			// 진단 데이터 로드
			// =====================================
			loadDiagnosisData() {
				const vhclSn = document.getElementById('vhclSn').value;
				const searchDate = dayjs().format('YYYY-MM-DD');
				
				customFetch({
					url: '/vehicle/getVehicleChckBkDnList',
					method: 'POST',
					params: { vhclSn, searchDate },
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
					onSuccess: (response) => {
						this.renderBreakdownHistory(response.data.bkdnList.list);
						this.renderCheckHistory(response.data.chckList.list);
					},
					onError: (error) => console.error('진단 데이터 조회 에러:', error)
				});
			},

					const badgeClass = item.chckStts == 2 ? 'danger' : 'warning';
					const badgeText = item.chckStts == 2 ? '경고' : '주의';
					const cardClass = badgeClass;

						<li>
							<div class="result_card ${cardClass} wh_box">
								<div class="result_card_header">
									<div>
										<span class="badge ${badgeClass}">${badgeText}</span>
										<span class="result_card_title">
											<i class="fa-solid fa-circle-exclamation"></i>
											${item.sysNm || item.chckNm || ''}
										</span>
									</div>
									<button class="btn sm grey check-detail-btn" data-index="${index}">상세보기</button>
								</div>
								<div class="result_card_info">
									<p>${item.msgCn || item.description || '진단 결과 정보가 없습니다.'}</p>
									${item.dtlCn ? `<p>${item.dtlCn}</p>` : ''}
								</div>
								<p class="result_card_date">발생 : ${bgngDt} ~ ${endDt}</p>
							</div>
						</li>

						const url = `${contextPath}/vehicle/chckManual?chckCd=${item.chckCd}`;
						window.open(url, '_blank');
					});
				});
			},
			
			// =====================================
			// 모달 관리
			// =====================================
			initModal() {
				const modal = this.elements.modal;
				const popDim = $(".popup_dim");
				const filterBtn = document.getElementById('filterBtn');
				const closeBtn = modal.querySelector('.popup_close');
				const selectAllBtn = document.getElementById('selectAllBtn');
				const deselectAllBtn = document.getElementById('deselectAllBtn');
				
				// 모달 열기/닫기
				filterBtn.addEventListener('click', () => {
					modal.style.display = 'block';
					popDim.show();
				});
				
				const closeModal = () => {
					modal.style.display = 'none';
					popDim.hide();
				};
				
				closeBtn.addEventListener('click', closeModal);
				
				// 모달 외부 클릭시 닫기
				window.addEventListener('click', (event) => {
					if (event.target === modal) {
						closeModal();
					}
				});
				
				// 전체 선택/해제
				selectAllBtn.addEventListener('click', () => {
					this.toggleAllSensors(true);
				});
				
				deselectAllBtn.addEventListener('click', () => {
					this.toggleAllSensors(false);
				});
				
				// 그룹 체크박스 이벤트
				document.querySelectorAll('.group-checkbox').forEach(groupCb => {
					groupCb.addEventListener('change', (e) => {
						this.toggleGroupSensors(e.target);
					});
				});
				
				// 서브그룹 체크박스 이벤트
				document.querySelectorAll('.subgroup-checkbox').forEach(subgroupCb => {
					subgroupCb.addEventListener('change', (e) => {
						this.toggleSubgroupVisibility(e.target);
					});
				});
				
				// 개별 센서 체크박스 이벤트
				document.querySelectorAll('.sensor-checkbox').forEach(sensorCb => {
					sensorCb.addEventListener('change', (e) => {
						this.toggleSensorVisibility(e.target);
					});
				});
			},
			
			toggleSubgroupVisibility(subgroupCheckbox) {
				const checkboxId = subgroupCheckbox.id;
				const idParts = checkboxId.replace('subgroup_', '').split('_');
				
				if (idParts.length < 2) return;
				
				const subGroupName = idParts[idParts.length - 1];
				const mainGroupName = idParts.slice(0, -1).join('_');
				const isChecked = subgroupCheckbox.checked;
				
				const sensorRows = document.querySelectorAll(`#sensorList tr[data-main-group="${mainGroupName}"][data-sub-group="${subGroupName}"].sensor-row`);
				
				if (isChecked) {
					this.applySensorVisibilityByToggleState(sensorRows, mainGroupName, subGroupName);
				} else {
					sensorRows.forEach(row => {
						row.style.display = 'none';
					});
				}
			},
			
			toggleAllSensors(checked) {
				const checkboxes = document.querySelectorAll('.sensor-checkbox, .subgroup-checkbox, .group-checkbox');
				checkboxes.forEach(cb => {
					cb.checked = checked;
					if (cb.classList.contains('sensor-checkbox')) {
						this.toggleSensorVisibility(cb);
					} else if (cb.classList.contains('subgroup-checkbox')) {
						this.toggleSubgroupVisibility(cb);
					}
				});
			},
			
			toggleGroupSensors(groupCheckbox) {
				const groupDiv = groupCheckbox.closest('.sensor-group');
				const sensorCheckboxes = groupDiv.querySelectorAll('.sensor-checkbox');
				
				sensorCheckboxes.forEach(cb => {
					cb.checked = groupCheckbox.checked;
					this.toggleSensorVisibility(cb);
				});
			},
			
			toggleSensorVisibility(sensorCheckbox) {
				const sensorSn = sensorCheckbox.dataset.sensorSn;
				const sensorRow = document.querySelector(`#sensorList tr[data-sensor-sn="${sensorSn}"]`);
				
				if (sensorRow) {
					if (sensorCheckbox.checked) {
						const mainGroup = sensorRow.dataset.mainGroup;
						const subGroup = sensorRow.dataset.subGroup;
						
						if (subGroup && subGroup !== 'null' && subGroup.trim() !== '') {
							this.applySensorVisibilityByToggleState([sensorRow], mainGroup, subGroup);
						} else {
							this.applySensorVisibilityByToggleState([sensorRow], mainGroup, null);
						}
					} else {
						sensorRow.style.display = 'none';
					}
				}
			},

			applySensorVisibilityByToggleState(sensorRows, mainGroupName, subGroupName) {
				const mainGroupHeader = document.querySelector(`#sensorList tr[data-group-name="${mainGroupName}"].main-group`);
				const mainToggleIcon = mainGroupHeader ? mainGroupHeader.querySelector('.toggle-icon') : null;
				const mainIsExpanded = !mainToggleIcon || !mainToggleIcon.style.transform.includes('-180deg');
				
				if (!mainIsExpanded) {
					sensorRows.forEach(row => {
						row.style.display = 'none';
					});
					return;
				}
				
				if (subGroupName) {
					const subGroupHeader = document.querySelector(`#sensorList tr[data-parent-group="${mainGroupName}"][data-group-name="${subGroupName}"].sub-group`);
					
					if (!subGroupHeader || subGroupHeader.style.display === 'none') {
						sensorRows.forEach(row => {
							row.style.display = 'none';
						});
						return;
					}
					
					const subToggleIcon = subGroupHeader.querySelector('.toggle-icon');
					const subIsExpanded = !subToggleIcon || !subToggleIcon.style.transform.includes('-180deg');
					
					sensorRows.forEach(row => {
						row.style.display = subIsExpanded ? '' : 'none';
					});
				} else {
					sensorRows.forEach(row => {
						row.style.display = '';
					});
				}
			}
		};		
		// =====================================
		// 초기화 실행
		// =====================================
		document.addEventListener('DOMContentLoaded', () => {
			VehicleDiagnosis.init();
		});
		
		// 페이지 언로드시 정리
		window.addEventListener('beforeunload', () => {
			VehicleDiagnosis.stopRealTimeUpdate();
		});
		
		// ai 위험점수 텍스트 애니메이션
		document.addEventListener("DOMContentLoaded", () => {
		  const scoreEl = document.querySelector(".score_area p b");
		  const target = parseInt(scoreEl.textContent, 10);
		  let current = 0;

		  const duration = 2500; // 2.5초 동안 올라감 (원하는 속도로 조정)
		  const frameRate = 16;  // 60fps 기준
		  const totalFrames = Math.round(duration / frameRate);
		  let frame = 0;

		  const counter = setInterval(() => {
		    frame++;
		    const progress = frame / totalFrames;

		    // ease-out 적용 (처음은 빠르고 마지막은 천천히)
		    const eased = 1 - Math.pow(1 - progress, 3);

		    current = Math.round(target * eased);
		    scoreEl.textContent = current;

		    if (frame >= totalFrames) {
		      clearInterval(counter);
		      scoreEl.textContent = target; // 정확히 도달
		    }
		  }, frameRate);
		});
	</script>

</body>
</html>
