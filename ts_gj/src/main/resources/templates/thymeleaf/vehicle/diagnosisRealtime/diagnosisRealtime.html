<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:th="https://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <th:block th:replace="/layout/head :: head"></th:block>
    <script th:src="@{/js/egovframework/common.js}"></script>
</head>
<body>
    <div class="wrap" id="wrap">
        <!-- 헤더 -->
        <div th:replace="/layout/header :: top-menu"></div>
        
        <!-- 메인 컨테이너 -->
        <div id="container">
            <div class="contents">
                
                <!-- 팝업 -->
                <div class="popup_dim"></div>
                <div class="popup_wrap">
                    <div class="popup_header">
                        <span>팝업 제목</span>
                        <button class="popup_close" title="닫기">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <div class="popup_body">
                        <p class="popup_cont_none">
                            해당부품의 정비지침서가 <br>존재하지 않습니다.
                        </p>
                    </div>
                </div>
                
                <!-- AI 실시간 진단 메인 -->
                <div class="wrapper type02">
                    <!-- 현재 시간 -->
                    <div class="now_time">
                        <i class="fa-regular fa-calendar"></i>
                        <span></span>
                    </div>
                    
                    <!-- 필터 영역 -->
                    <div class="filter_area wh_box">
                        <div class="filter_box_wrap">
                            <!-- 소유자 선택 -->
                            <div th:replace="/common/ownrSelect :: ownr-select"></div>
                            
                            <!-- 차량번호 검색 -->
                            <div class="filter_box">
                                <label for="regNoInput">차량번호</label>
                                <div class="filter_input_area">
                                    <input type="text" id="regNoInput" placeholder="예) 광주12가3456">
                                    <ul class="dropdown" id="dropdown" style="display:none;"></ul>
                                    <th:block th:replace="/common/regNo :: regNo-search"></th:block>
                                </div>
                            </div>
                        </div>
                        <button class="btn lg black btn_search" id="searchBtn">검색</button>
                    </div>
                    
                    <!-- AI 진단 결과 -->
                    <div class="ai_diagnosis">
                        <!-- 위험 차량 -->
                        <div class="diag_alert danger" data-status="danger">
                            <p>
                                <i class="fa-solid fa-circle-exclamation"></i>
                                AI가 판단한 <b>정비가 시급한 차량</b>입니다.
                            </p>
                        </div>
                        <ul class="vehicle_card_wrap" id="dangerDataArea"></ul>
                        
                        <!-- 안전 차량 보기 버튼 -->
                        <div class="vehicle_view_btn_wrap" id="displaySafe">
                            <button class="vehicle_view_btn">
                                안전 차량 보기
                                <i class="fa-solid fa-angle-down"></i>
                            </button>
                        </div>
                        
                        <!-- 안전 차량 -->
                        <div class="diag_alert safe" data-status="safe" id="safeArea" style="display:none;">
                            <p>
                                <i class="fa-solid fa-circle-check"></i>
                                안전한 <b>차량</b>입니다.
                            </p>
                        </div>
                        <ul class="vehicle_card_wrap" id="safeDataArea"></ul>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 푸터 -->
        <th:block th:replace="/layout/footer :: footer-simple"></th:block>
    </div>

    <script>
        // 상수 정의
        const VEHICLE_STATUS = {
            STOPPED: '0',
            DRIVING: '1'
        };

        const CHECK_STATUS = {
            SAFE: '0',
            WARNING: '1',
            DANGER: '2'
        };

        const STATUS_CONFIG = {
            vehicle: {
                [VEHICLE_STATUS.STOPPED]: { class: 'garage', text: '차고지' },
                [VEHICLE_STATUS.DRIVING]: { class: 'drive', text: '운행중' }
            },
            check: {
                [CHECK_STATUS.SAFE]: 'safe',
                [CHECK_STATUS.WARNING]: 'warning',
                [CHECK_STATUS.DANGER]: 'danger'
            }
        };

        // 초기화
        $(document).ready(function() {
            initializePage();
            bindEvents();
        });

        function initializePage() {
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            getVehicleStatusList('danger');
            $('#displaySafe').show();
        }

        function bindEvents() {
            $('#displaySafe').on('click', handleSafeVehicleToggle);
            $('#searchBtn').on('click', handleSearch);
            
            // 동적으로 생성되는 차량 리스트 아이템에 대한 이벤트 위임
            $(document).on('click', '.vehicle_li', function() {
                const vhclSn = $(this).data('vhcl-sn');
                goDetail(vhclSn);
            });
        }

        function handleSafeVehicleToggle() {
            const safeArea = $('#safeArea');
            const safeDataArea = $('#safeDataArea');
            const button = $('#displaySafe .vehicle_view_btn');
            const icon = button.find('i');
            
            // 토글 처리
            safeArea.toggle();
            safeDataArea.toggle();
            
            // 버튼 텍스트와 아이콘 변경
            if (safeArea.is(':visible')) {
                getVehicleStatusList('safe');
                button.html('안전 차량 숨기기 <i class="fa-solid fa-angle-up"></i>');
            } else {
                button.html('안전 차량 보기 <i class="fa-solid fa-angle-down"></i>');
            }
        }

        function handleSearch() {
            getVehicleStatusList('danger');
            $('#safeArea, #safeDataArea').hide();
        }

        function getVehicleStatusList(status) {
            const params = {
                ownrNm: $('#ownrSelect').val() || 'all',
                regNoInput: $('#regNoInput').val() || 'all',
                stts: status
            };

            customFetch({
                url: '/vehicle/getVehicleSttsList',
                method: 'POST',
                params: params,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                loadingId: status + 'DataArea',
                onSuccess: (response) => handleVehicleListSuccess(response, status),
                onError: (error) => console.error('에러 발생:', error)
            });
        }

        function handleVehicleListSuccess(response, status) {
        	console.log(response);
            const dataArea = $(`#${status}DataArea`);
            const alertElement = $(`.diag_alert[data-status="${status}"]`);
            
            dataArea.empty();

            if (isValidResponse(response)) {
                renderVehicleList(response.data.list, dataArea);
                showStatusElements(status, alertElement);
            } else {
                hideStatusElements(status, alertElement);
            }
        }

        function isValidResponse(response) {
            return response.status === 'SUCCESS' && 
                   response.data && 
                   response.data.list && 
                   response.data.list.length > 0;
        }

        function renderVehicleList(vehicleList, dataArea) {
            vehicleList.forEach(vehicle => {
                const vehicleItem = createVehicleListItem(vehicle);
                dataArea.append(vehicleItem);
            });
        }

        function showStatusElements(status, alertElement) {
            alertElement.show();
            if (status === 'safe') {
                $('#safeArea, #safeDataArea').show();
            }
        }

        function hideStatusElements(status, alertElement) {
            alertElement.hide();
            if (status === 'safe') {
                $('#safeArea, #safeDataArea').hide();
            }
        }

        function createVehicleListItem(vehicle) {
            const statusInfo = getVehicleStatusInfo(vehicle.vhclStts);
            const cardClass = getCheckStatusClass(vehicle.chckStts);
            const aiScore = vehicle.scr || Math.floor(Math.random() * 100);
            //console.log(vehicle)
            const errorBox = createErrorBox(vehicle.chckList, vehicle.bkdnCdList);

            return `
                <li class="vehicle_li" tabindex="0" data-vhcl-sn="${vehicle.vhclSn || ''}">
                    <div class="vehicle_card ${cardClass}">
                        <div class="vehicle_header">
                            <strong class="vehicle_number">${vhclMasked(vehicle.regNo)}</strong>
                            <span class="badge ${cardClass}">AI 안전점수 <b>${aiScore}</b>점</span>
                        </div>
                        <div class="vehicle_content">
                            <em class="status_text ${statusInfo.class}">${statusInfo.text}</em>
                            ${errorBox}
                        </div>
                    </div>
                </li>
            `;
        }

        function getVehicleStatusInfo(status) {
            return STATUS_CONFIG.vehicle[status] || { class: 'unknown', text: '알 수 없음' };
        }

        function getCheckStatusClass(status) {
            return STATUS_CONFIG.check[status] || 'safe';
        }

        function createErrorBox(chckList, bkdnList) {
            let htmlOutput = '';

            // 고장코드 영역 (항상 표시)
            if (bkdnList && bkdnList.length > 0) {
                const firstError = bkdnList[0].bkdn_cd;
                const additionalCount = bkdnList.length > 1 ? 
                    ` 외 ${bkdnList.length - 1}개` : '';
                
                htmlOutput += `
                    <div class="error_box breakdown">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span>고장코드 ${firstError}${additionalCount} 발생</span>
                    </div>
                `;
            } else {
                htmlOutput += `
                    <div class="error_box breakdown normal">
                        <span>고장코드 미발생</span>
                    </div>
                `;
            }

            // 센서 점검 영역 (항상 표시)
            if (chckList && chckList.length > 0) {
            	// chck_nm 기준으로 중복 제거
            	const uniqueChckNmList = [...new Set(chckList.map(item => item.chck_nm))];
            	
                const firstSensor = uniqueChckNmList[0];
                const additionalCount = uniqueChckNmList.length > 1 ? ` 외 ${uniqueChckNmList.length - 1}개` : '';
                
                htmlOutput += `
                    <div class="error_box check">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span>${firstSensor}${additionalCount} 점검 필요</span>
                    </div>
                `;
            } else {
                htmlOutput += `
                    <div class="error_box check normal">
                        <span>센서 진단 결과 정상</span>
                    </div>
                `;
            }

            return htmlOutput;
        }

        function updateCurrentTime() {
            const timeString = dayjs().format('YYYY년 MM월 DD일 HH:mm:ss');
            $('.now_time span').text(timeString);
        }

        function goDetail(vhclSn) {
            if (!vhclSn) {
                console.warn('차량 일련번호가 없습니다.');
                return;
            }
            
            // 상세 페이지로 이동 (실제 URL은 프로젝트에 맞게 수정)
            window.location.href = contextPath + `/vehicle/diagnosisRealtimeResult?vhclSn=${vhclSn}`;
        }
    </script>
</body>
</html>
