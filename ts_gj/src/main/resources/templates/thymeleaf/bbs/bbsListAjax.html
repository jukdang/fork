<script>
let searchKywd = $("input[name='searchKywd']").val()
$(function() {

})

/**
 * 게시글 목록을 검색하여 Ajax 요청을 통해 서버로부터 데이터를 조회한다.
 *
 * Parameters (from DOM):
 * @param {string} pageIndex   - 현재 페이지 번호 (기본값: '1')
 * @param {string} searchType  - 검색 조건 (예: 제목, 내용 등)
 * @param {string} searchKywd  - 검색 키워드
 *
 * Response (JSON):
 * - 성공: 게시글 목록과 페이징 정보
 * - 실패: 에러 메시지 출력
 */
function fn_search(pageIndex = 1) {
	 
	// pageIndex가 비어있거나 null이면 기본값 1로 설정
    pageIndex = pageIndex ? pageIndex : `1`;

    let ctgry = `ntc`;
    const searchType = $("#searchType").val();
    const searchKywd = $("#searchKywd").val();
	
 	// 파라미터 한 번에 객체로 구성
    const params = {
  		ctgry: ctgry,
        pageIndex: pageIndex,
        searchType: searchType,
        searchKywd: searchKywd
    };
 	
//  	console.log("params", params);
 	
 	// ajax 사용
    commonAjaxBoardList('/bbs/getBbsListAjax', params, renderList, 'fn_search');
 	
 	// customFetchPost 사용
//     customFetchPost('/bbs/getBbsList.do', params, {
//         loadingId: 'load_wrap', // 필요 시 로딩 표시할 요소 ID 입력
//         onSuccess: function(res) {
//             console.log(res);
//             renderList(res);
//             console.log("customFetchPost")
//             if (res.paginationInfo) {
//                 pagination(res.paginationInfo, 'fn_search');
//             }
//         },
//         onError: function(err) {
//             console.error(`[Ajax Error]`, err);
//         },
//         onFinally: function() {
//             // 로딩 해제 또는 추가 처리
//         }
//     });
 	
}

//표에 렌더링
function renderList(res) {
    const list = res.resultList || [];
    const pagination = res.paginationInfo || {};
    const totalCount = pagination.totalRecordCount || 0;
    const currentPage = pagination.currentPageNo || 1;
    const recordPerPage = pagination.recordCountPerPage || 10;

    let html = '';

    if (list.length === 0) {
        html = `<tr><td colspan="8" style="text-align:center;">등록된 게시물이 없습니다.</td></tr>`;
    } else {
        list.forEach((board, index) => {
            const no = totalCount - ((currentPage - 1) * recordPerPage + index);
            const imptYn = board.imptYn === 'Y' ? true : false;
            const popupNotice = board.popupNotice === 'Y' ? true : false;
            const fileCount = board.fileCount || 0;

            // 날짜는 timestamp(ms)라 가정하고 yyyy-MM-dd 형식으로 변환
            const regDate = new Date(board.regDt);
            const regDateStr = regDate.toISOString().slice(0, 10); // YYYY-MM-DD

            html += `
				<tr onclick="boardDetail('${board.sn}')">
				    <td class="listtd">${imptYn ? '<i class="fa-solid fa-bullhorn"></i>' : `<span>${no}</span>`}</td>
				    <td class="listtd">${board.ctgry === 'ntc' ? '<span class="board_cate">공지사항</span>' : `<span>${board.ctgry}</span>`}</td>
				    <td class="listtd"><a class="list_tit" href="javascript:void(0)">${escapeHtml(board.ttl)}</a></td>
				    <td class="listtd">${fileCount > 0 ? `<span class="file-icon"><i class="fa-regular fa-file"></i></span>` : ''}</td>
				    <td class="listtd">${popupNotice ? `<span class="popup-icon"><i class="fa-solid fa-check"></i></span>` : ''}</td>
				    <td class="listtd">${escapeHtml(board.regId)}</td>
				    <td class="listtd">${regDateStr}</td>
				    <td class="listtd">${board.inqCnt}</td>
				</tr>
            `;
        });
    }

    $('#dataList').html(html);
}
</script>
