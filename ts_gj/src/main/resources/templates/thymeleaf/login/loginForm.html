		         <form th:action="@{/login/loginProc}" method="post">
		         	<div class="member_wrap_section">
			         	<div class="logo" title="메인 페이지로 이동">
							<a th:href="@{/}">
								<span>광주 시내버스 관제</span>
							</a>
						</div>
						<div class="wh_box">
							<strong>로그인</strong>
							<div>
								<!-- 스크린 리더용 라벨 -->
							    <label for="mbrId" class="sr-only">아이디</label>
							    <input type="text" id="mbrId" name="mbrId" autofocus placeholder="아이디를 입력해주세요.">
						    </div>
						    <div class="pass_input">
						    	<!-- 스크린 리더용 라벨 -->
							    <label for="mbrPswd" class="sr-only">비밀번호</label>
							    <input type="password" id="mbrPswd" name="mbrPswd" placeholder="비밀번호를 입력해주세요.">
							    <span class="icon_view">
							    <!-- 비밀번호 표시 -->
							    <i class="fa-regular fa-eye" style="display: none;" tabindex="0"></i>
							    <!-- 비밀번호 표시안함 -->
							    <i class="fa-regular fa-eye-slash" tabindex="0"></i>
							    </span>
						    </div>
						    
						   	<!-- 에러 메시지 -->
							<p th:if="${param.error}" class="alert alert_error">
							    아이디와 비밀번호를 확인해주세요.
							</p>
							
							<div class="check_area">
								<div>
								    <input type="checkbox" id="remember-me" name="remember-me">
	        						<label for="remember-me" title="로그인 상태 유지">로그인 상태 유지</label>				
							    </div>
							   <!--  <a href="" title="아이디/비밀번호 찾기">아이디/비밀번호 찾기</a> -->
						    </div>
						    <button class="btn" type="submit" title="로그인">로그인</button>
						</div>

				        </div> -->
					</div>
					
		         </form>
