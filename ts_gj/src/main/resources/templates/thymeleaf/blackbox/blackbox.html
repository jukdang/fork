	//센서 셀렉박스 중복 방지
	function preventDuplicate() {
	    const selectElements = [
	        document.getElementById('select_box1'),
	        document.getElementById('select_box2'),
	        document.getElementById('select_box3')
	    ];
	
	    const selectedValues = selectElements.map(select => select.value);
	
	    selectElements.forEach(select => {
	        Array.from(select.options).forEach(option => {
	            if (option.value != "" && selectedValues.includes(option.value) && option.value !== select.value) {
	                option.disabled = true;
	            } else {
	                option.disabled = false;
	            }
	        });
	    });
	}
	
	//센서 리스트 가져오기
	function getSensorInfo() {
		
		markerList = [];
		markerPositions = [];
		
		if(regNo == '') {
			alert("차량번호를 선택해주세요.");
			$("#regNoInput").focus();
			return false;
		}
	
	    const params = {
	    	vhclType: vhclType
	    };
		
	    customFetch({
	        url: '/vehicle/getSensorInfo',
	        method: 'POST',
	        params: params,
	        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
	        onSuccess: (response) => {
	            console.log('getSensorInfo 조회 성공:', response);
	            if(response.code == 200) {
	            	setSensorList(response, regNo, mtId)
	            }
	            
	        },
	        onError: (error) => console.error('에러 발생:', error)
	    });
		
	}
	
	//센서 리스트 세팅
	function setSensorList(response, regNo, mtId) {
		
		let sensorInfo = response.data.list;
		
		if(sensorInfo.length == 0) {
			$('#sensorList').parent().hide();
			return false;
		}
		
		//display 값이 Y인것만
		const filteredData = sensorInfo.filter(item => item.vwYn !== "N");
		var html = '';
		const groups = {};
		filteredData.forEach(sensor => {
		    // sysNm이 null이면 'ETC'로 처리
		    let key = sensor.sysNm || "ETC";
	
		    if (!groups[key]) {
		        groups[key] = [];
		    }
		    groups[key].push(sensor);
		});
	//		console.log("groups", groups)
		for (const group of [...Object.keys(groups).filter(g => g !== "ETC"), ..."ETC" in groups ? ["ETC"] : []]) {
			const sensors = groups[group];
		    let groupName = group;
		    html += '<li>';
		    html += '	<div class="list">';
		    html += '		<div class="list_tit">';
		    html += '			<span>'+groupName+'</span>';
		    html += '			<em class="all_check">';
		    html += '				<input type="checkbox" class="selectAllCheckbox" id="AllChk_'+groupName+'" data-group="'+groupName+'">';
		    html += '				<label for="AllChk_'+groupName+'"><span>전체 선택</span></label>';
		    html += '			</em>';
		    html += '		</div>';
		    html += '		<div class="desc disflex">';
		    sensors.forEach(sensor => {
		        html += '			<input type="checkbox" class="sensorCheckbox" id="chk'+sensor.snsrSn+'" name="'+groupName+'" data-code="'+sensor.snsrCd+'" data-name="'+sensor.snsrNm+'" data-switch="'+sensor.sttsTypeYn+'">';
		        html += '			<label for="chk'+sensor.snsrSn+'"><span>'+sensor.snsrNm+'</span></label>';
		    });
		    html += '		</div>';
		    html += '	</div>';
		    html += '</li>';
	    }
		
		$('#sensorList').html(html);
		$('#sensorList').parent().show();
		$('.selectAllCheckbox').change(function() {
	        var group = $(this).data('group');
	        var isChecked = $(this).prop('checked');
	        $('input[name="' + group + '"]').prop('checked', isChecked);
	    });
	
	    // 개별 체크박스 변경 시 전체 선택 체크박스 상태 업데이트
	    $('.sensorCheckbox').change(function() {
	        var group = $(this).attr('name');
	        var allCheckbox = $('#AllChk_' + group);
	        var checkboxes = $('input[name="' + group + '"]');
	        var allChecked = checkboxes.filter(':checked').length === checkboxes.length;
	        allCheckbox.prop('checked', allChecked);
	    });
	    
	    //센서 셀렉박스 3개 세팅
	    var optionHtml = "<option value=''>선택</option>";
		for(var i = 0; i < $(".sensorCheckbox").length; i++) {
			if($(".sensorCheckbox").eq(i).data('name') != "GPS 경도" && $(".sensorCheckbox").eq(i).data('name') != "GPS 위도") {
	    		//optionHtml += "<option value='" + $(".sensorCheckbox").eq(i).data('code') + "'>" + $(".sensorCheckbox").eq(i).data('name') + "</option>";
				optionHtml += "<option data-switch='"+$(".sensorCheckbox").eq(i).data('switch')+"' value='" + $(".sensorCheckbox").eq(i).data('code') + "'>" + $(".sensorCheckbox").eq(i).data('name') + "</option>";
			}
		}
		$("#select_box1").empty().append(optionHtml);
		$("#select_box2").empty().append(optionHtml);
		$("#select_box3").empty().append(optionHtml);
		
	    //센서 데이터 차트
	    getChartData();
	    
	    //지도위 버스 표시
	    getInfluxData(regNo, mtId);
	}
	
	//센서 데이터 가져오기
	function getChartData() {
		
		preventDuplicate();
		
		var selectBoxColList = [];
		var selectBoxSeriesList = [];
		var selectBoxSwitchList = [];
		
		for(var i = 0; i < 3; i++) {
			if($("#select_box" + (i + 1)).val() != "") {
				selectBoxColList.push($("#select_box" + (i + 1)).val());
				selectBoxSeriesList.push($("#select_box" + (i + 1) + " :selected").text());
				selectBoxSwitchList.push($("#select_box" + (i + 1) + " :selected").data('switch'));
			}
		}
		
		var selectBoxCol = selectBoxColList.filter(item => item !== "").join(",");
		
		if(selectBoxCol != "") {
			selectBoxCol = "_time," + selectBoxCol;
		}else {
			$(".cont_none").show();
			return false;
		}
		
		var endDate = new Date($('#startDate').val()+'T'+$("#endTime").val()+':00');
		var startDate = new Date($('#startDate').val()+'T'+$("#startTime").val()+':00');
		
		let start_date_time = new Date(startDate).toISOString().split('.')[0] + 'Z';
	    let end_date_time = new Date(endDate).toISOString().split('.')[0] + 'Z';
		
		const params = {
			start_date_time: start_date_time,
	        end_date_time: end_date_time,
	        influx_column: selectBoxCol,
	        influx_table: mtId
	    };
		
	    customFetch({
	        url: '/influx/getSensorHistory',
	        method: 'POST',
	        params: params,
	        loadingId: 'chartDiv',
	        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
	        onSuccess: (response) => {
	            console.log('getChartData 조회 성공:', response);
	           	setChartData(response, selectBoxColList, selectBoxSeriesList, selectBoxSwitchList);
	            
	        },
	        onError: (error) => console.error('에러 발생:', error)
	    });
		
	}

		let resultData = [];

		}
		
		$(".cont_none").hide();
		makeLineChart("chartDiv", data, selectBoxColList, selectBoxSeriesList, selectBoxSwitchList);
	}
	
	//센서 데이터 다운로드
	function fn_download() {
		
		if($('input[type="checkbox"].sensorCheckbox:checked').length == 0) {
			alert("센서를 선택해주세요.");
			return false;
		}
		
		var endDate = new Date($('#startDate').val()+'T'+$("#endTime").val()+':00');
		var startDate = new Date($('#startDate').val()+'T'+$("#startTime").val()+':00');
		
	    let start_date_time = new Date(startDate).toISOString().split('.')[0] + 'Z';
	    let end_date_time = new Date(endDate).toISOString().split('.')[0] + 'Z';
		
		var checkedCodes = [];
		var checkedCodeNames = [];
		$('input[type="checkbox"].sensorCheckbox:checked').each(function() {
	        var code = $(this).data('code');
	        var name = $(this).data('name');
	        
	        if (code) {
	            checkedCodes.push(code); // 배열에 추가
	            checkedCodeNames.push(name);
	        }
	    });
		
		let columns = checkedCodes.length ? "_time," + checkedCodes.join(',') : "";
		let columnNames = checkedCodeNames.length ? "_time," + checkedCodeNames.join(',') : "";
		
		const params = {
	        start_date_time: start_date_time,
	        end_date_time: end_date_time,
	        influx_column: columns,
	        influx_column_name: columnNames,
	        influx_table: mtId
	    };
		
		$.ajax({
	        type: "POST",
	        url: contextPath + "/blackbox/dataDownload",
	        data: params,
	        success: function(response) {
	            // CSV 파일 다운로드
	            var blob = new Blob(["\ufeff"+response], { type: 'text/csv;charset=UTF-8' });
	            var link = document.createElement('a');
	            link.href = window.URL.createObjectURL(blob);
	            link.download = vhclMasked(regNo)+'.csv';
	            document.body.appendChild(link);
	            link.click();
	            document.body.removeChild(link);
	            window.URL.revokeObjectURL(link.href);
		    	setTimeout(function(){
		    	 	$('.loading_bg').removeClass('on');
				},0)
	        },
	        error: function(xhr, status, error) {
				setTimeout(function(){
		    	 	$('.loading_bg').removeClass('on');
				},0)
				alert('죄송합니다. \n데이터 처리 중에 시간 초과가 발생하여 연결이 끊어졌습니다. \n검색 기간을 줄여 다시 시도해주세요.').
	            console.error("Error: ", error);
	        }
	    });
		
	}
	
	//
	function makeLineChart(id, data, selectBoxColList, selectBoxSeriesList, selectBoxSwitchList) {
	//     console.log("data", data);
	    if(MyGlobalObject[id]){   //check if exist chart dispose that
			MyGlobalObject[id].dispose();
	    }
	
	    // Create root element
	    // https://www.amcharts.com/docs/v5/getting-started/#Root_element
	    var root = am5.Root.new(id);
	
	    // Set themes
	    // https://www.amcharts.com/docs/v5/concepts/themes/
	    root.setThemes([am5themes_Animated.new(root)]);
	
	    // Create chart
	    // https://www.amcharts.com/docs/v5/charts/xy-chart/
	    var chart = root.container.children.push(
	        am5xy.XYChart.new(root, {
	            panX: false,
	            panY: false,
	            //wheelX: "panX",
	            //wheelY: "zoomX",
	            paddingLeft: 0,
	            layout: root.verticalLayout
	        })
	    );
	
	    // Create axes
	    // https://www.amcharts.com/docs/v5/charts/xy-chart/axes/
	    var xRenderer = am5xy.AxisRendererX.new(root, {
	        minorGridEnabled: true,
	        minGridDistance: 150
	    });
	    
	    var xAxis = chart.xAxes.push(
	        am5xy.CategoryAxis.new(root, {
	            categoryField: "date",
	            //baseInterval: { timeUnit: "second", count: 1 },
	            renderer: xRenderer,
	            tooltip: am5.Tooltip.new(root, {}),
	            grid: {
	                template: {

	//인플럭스 이동경로 좌표
	function getInfluxData(bus) {
		
		removeMarkerPolyline();
		
		var endDate = new Date($('#startDate').val()+'T'+$("#endTime").val()+':00');
		var startDate = new Date($('#startDate').val()+'T'+$("#startTime").val()+':00');
		
	    let start_date_time = new Date(startDate).toISOString().split('.')[0] + 'Z';
	    let end_date_time = new Date(endDate).toISOString().split('.')[0] + 'Z';
	    
	    const params = {
	   		influx_table : mtId,
			influx_column : "_time, GPS_longitude, GPS_Latitude, VCU_VehicleSpeed_STD",
	    	start_date_time : start_date_time,
	    	end_date_time : end_date_time
	    };
		
	    customFetch({
	        url: '/influx/getSensorHistory',
	        method: 'POST',
	        params: params,
	        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
	        onSuccess: (response) => {
	            console.log('getInfluxData 조회 성공:', response);
	           	setRouteOnMap(response)
	            
	        },
	        onError: (error) => console.error('에러 발생:', error)
	    });
	    
	}
	
	//지도 위에 버스 이동 경로 표시
	function setRouteOnMap(response) {
		
		let data = response.result;
		
		if(data.length == 0) {
			removeMarkerPolyline(); //마커 초기화
			return false;
		}
		
		try{
	
			for(var i = 0; i < data.length; i++) {
				var coord = convertCoordinates(data[i].GPS_longitude, data[i].GPS_Latitude);
				
				markerList.push({date : data[i].time, lat : coord[0], lng : coord[1], speed:data[i].VCU_VehicleSpeed_STD});
				markerPositions.push(coord);
			}
			
	//			console.log("markerList", markerList);
			setMarker(markerList);
			
			
		}catch(e){
	
		}
	}

	function dmsToDecimal(degrees, minutes) {
	    return degrees + minutes / 60;
	}
	
	function convertCoordinates(longitude, latitude) {
	    const lonDegrees = Math.floor(longitude / 100);
	    const lonMinutes = longitude - (lonDegrees * 100);
	
	    const latDegrees = Math.floor(latitude / 100);
	    const latMinutes = latitude - (latDegrees * 100);
	
	    const decimalLongitude = dmsToDecimal(lonDegrees, lonMinutes);
	    const decimalLatitude = dmsToDecimal(latDegrees, latMinutes);
	
	    return [decimalLatitude, decimalLongitude];
	}
	
	//이동경로 세팅
	function setMarker(pathCoords) {
		
		removeMarkerPolyline();
		
		if(pathCoords.length == 0) {
			return false;
		}
		
	// 	console.log("pathCoords", pathCoords);
		
		for(var i = 0; i < pathCoords.length; i++) {
			
			var marker = L.circleMarker([pathCoords[i].lat, pathCoords[i].lng], {
	            radius: 3, // 동그라미 반지름
	            fillColor: '#db4455', // 채우기 색상
	            color: '#db4455', // 테두리 색상
	            weight: 0.5, // 테두리 두께
	            opacity: 1, // 테두리 투명도
	            fillOpacity: 0.5 // 채우기 투명도
	        }).bindPopup(
		        `<b>차량번호:</b> ${vhclMasked(regNo)}<br>
		         <b>일시:</b> ${pathCoords[i].date}<br>
		         <b>속력:</b> ${formatNumber(pathCoords[i].speed)} km/h`
		    ).addTo(map);	//버스 마커
	        
	     	// 마커에 사용자 정의 속성 추가
	        marker.options.date = pathCoords[i].date;
	        marker.options.vehicleSpeed = pathCoords[i].vehicleSpeed;
	        marker.options.engineSpeed = pathCoords[i].engineSpeed;
	        
	     	// 마커 배열에 저장
	        markers.push(marker);
	        
			
		}
		
		// 모든 마커의 좌표를 포함하는 경계 상자(bounding box)를 계산
		var bounds = L.latLngBounds(markerPositions);
	
		// 경계 상자의 중심 좌표를 구함
		var center = bounds.getCenter();
	
		// 중간에 있는 마커의 좌표를 찾기 위한 코드
		var nearestMarkerCoord;
		var minDistance = Infinity;
	
		// 모든 마커들과 중심점 간의 거리를 계산하여 가장 가까운 마커를 찾음
		markers.forEach(function(marker) {
		    var markerCoord = marker.getLatLng();
		    var distance = markerCoord.distanceTo(center);
	
		    if (distance < minDistance) {
		        minDistance = distance;
		        nearestMarkerCoord = markerCoord;
		    }
		});
	
		// 지도를 원하는 좌표로 이동하고 원하는 줌 레벨로 설정
	// 	console.log("가장 중간에 있는 마커의 좌표:", nearestMarkerCoord);
		map.setView([nearestMarkerCoord.lat, nearestMarkerCoord.lng], 10);
		
	}
	
	//마커, 폴리라인 삭제
	function removeMarkerPolyline() {
		
		// 저장된 모든 마커 제거
	    markers.forEach(function(marker) {
	        marker.remove();
	    });
	    markers = []; // 배열 초기화
	}
