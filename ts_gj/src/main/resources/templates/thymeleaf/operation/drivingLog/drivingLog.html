	<script th:inline="javascript">
	/*<![CDATA[*/
	var oprSchdl = /*[[${result.oprSchdl}]]*/ '[]';
	oprSchdl = JSON.parse(oprSchdl);
	
	var $prevTr = $('#oprSchdlList'); // 기준 tr
	var $th = $('#oprSchdlTh');       // rowspan 적용할 th
	
	if (oprSchdl.length === 0) {
	    // 데이터 없을 때
	    var $tr = $('<tr>', { id: 'oprSchdlRowEmpty' });
	    $tr.append(
	        $('<td>', { colspan: 11, text: '운행 시간표가 없습니다.' })
	    );
	    $prevTr.after($tr);
	    // rowspan = 2 (헤더 + 한 줄 없음 표시)
	    $th.attr('rowspan', 2);
	} else {
	    // 데이터 있을 때
	    $th.attr('rowspan', oprSchdl.length + 1); // header 포함
	    $.each(oprSchdl, function(index, item) {
	        var $tr = $('<tr>', { id: 'oprSchdlRow' + index });
	        $tr.append(
	            $('<td>').text(item['회차']),
	            $('<td>').text(item['기점']),
	            $('<td>').text(item['종점']),
	            $('<td>').text(item['기점출발']),
	            $('<td>').text(item['종점도착']),
	            $('<td>').text(item['소요시간1']),
	            $('<td>').text(item['종점출발']),
	            $('<td>').text(item['기점도착']),
	            $('<td>').text(item['소요시간2']),
	            $('<td>').text(vhclMasked(item['차량번호'])),
	            $('<td>').text(item['노선명'])
	        );
	        $prevTr.after($tr);
	        $prevTr = $tr;
	    });
	}
	/*]]>*/
	</script>
	
	<script>
	$(function() {
	    const span = $("#ownrNm");
	    span.text(ownrMasked(span.text()))
	})
	
	//목록
	function goToList() {
		location.href = contextPath + "/operation/drivingLogList";
	}
	
	//PDF 다운로드
	function pdfDownload() {
		
		$("#downloadBtn").hide();
		$("#listBtn").hide();
		$("#container").addClass("driving-log-pdf");
	
		jQuery("#container").printThis({
	
			 debug: false,               // show the iframe for debugging
	
			 importCSS: true,            // import page CSS
	
			 importStyle: true,         // import style tags
	
			 printContainer: true,       // grab outer container as well as the contents of the selector
	
			 //loadCSS: "path/to/my.css",  // path to additional css file - us an array [] for multiple
	
			 pageTitle: $("#title").text(),              // add title to print page
	
			 //removeInline: false,        // remove all inline styles from print elements
	
			 printDelay: 200,            // variable print delay
	
			 header: null,               // prefix to html
	
			 footer: null,               // postfix to html
	
			 base: false,                // preserve the BASE tag, or accept a string for the URL
	
			 formValues: true,           // preserve input/form values
	
			 canvas: true,              // copy canvas elements (experimental)
	
			 doctypeString: '',       // enter a different doctype for older markup
	
			 removeScripts: false,       // remove script tags from print content
		
			 afterPrint: function() {
	
				 $("#downloadBtn").show();
				 $("#listBtn").show();
				 $("#container").removeClass("driving-log-pdf");
				
		     }
	
		});
	}
	</script>
