	<script>
	const urlParams = new URLSearchParams(window.location.search);
	const oprtrId = urlParams.get("oprtrId");
	const rptYm   = urlParams.get("rptYm").slice(0, 4) + "-" + urlParams.get("rptYm").slice(4, 6);
	//Leaflet map initialization
	let map = L.map('map_div',{
		minZoom: 7, // 최소 확대 수준
	  maxZoom: 18, // 최대 확대 수준
	  maxBounds: L.latLngBounds(L.latLng(33.0, 124.0), L.latLng(39.0, 132.0)) // 한반도 지역의 경계를 벗어나지 못하도록 설정
	}).setView([35.15, 126.852601], 8); // Set center and zoom level
	
	L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
	}).addTo(map);
	
	//리포트 title
	$("#title").text(rptYm.split("-")[0] + "년 " + rptYm.split("-")[1] + "월 운전습관 리포트");
	
	let chartData = {
				data1:[],
				data2:[],
				data3:[],
				data4:[],
				data5:[]
			};
	
	$(function() {
		getDriverReport();
	})
	
	//리포트 데이터
	function getDriverReport() {
		
		const params = {
			oprtrId: oprtrId,
			rptYm: rptYm
	    };
		
	    customFetch({
	        url: '/operation/getDriverReport',
	        method: 'POST',
	        params: params,
	        aiLoadingId: 'wrap',
	        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
	        onSuccess: (response) => {
	            console.log('getDriverReport 조회 성공:', response);
	            setDriverReport(response);
	        },
	        onError: (error) => console.error('에러 발생:', error)
	    });
	    
	}
	
	//리포트 데이터 콜백 함수
	function setDriverReport(response) {
	    
	    if(response.code == 200) {
	
	    	let data1 = response.data.data1 ? response.data.data1 : [];
	    	let data2 = response.data.data2 ? response.data.data2 : [];
	    	let data3 = response.data.data3 ? response.data.data3 : [];
	    	let list = response.data.list[0];
	    	
	    	chartData.data1 = data1;
	    	chartData.data2 = data2;
	    	chartData.data3 = data3;
	    		
	    	//운전원명, 운수회사, 주요노선, 일평균 운행시간
	        $("#oprtrNm").text(oprtrMasked(list.oprtrNm));
	        $("#ownrNm").text(ownrMasked(list.ownrNm));
	        $("#mainRteNm").text(list.mainRteNm);
	        $("#avgOprTm").text(formatTimeFromMinutes(list.avgOprTm));
	    	
	    	//안전운전 진단결과
	    	runGauge($("#oprScr"), list.oprScr);
	    	$("#oprScrRankType").html(`<em>${list.oprScrRankType}</em><b>${list.oprScrPercentileMin}%</b>`);
	    	$("#oprScrRankType").removeClass("high low").addClass(list.oprScrRankType === '하위' ? 'low' : 'high');
	    	
	    	//CNG 경제운전 진단결과
	        runGauge($("#ecnmScr"), list.ecnmScr);
	        $("#ecnmScrRankType").html(`<em>${list.ecnmScrRankType}</em><b>${list.ecnmScrPercentileMin}%</b>`);
	        $("#ecnmScrRankType").removeClass("high low").addClass(list.ecnmScrRankType === '하위' ? 'low' : 'high');
	    	
	    	//AI 종합 진단 결과
	    	let aiChckCn = list.aiChckCn ? list.aiChckCn : "";
	    	$("#description1").html(aiChckCn);
	    	
	    	//주행 성능 분석
			makeCustomHorizontalBarChart("chartDiv1", data1, "metricName", "Y");
	    	
	    	//위험운행행태 현황
	    	pieChart("chartDiv2", data2, "구분");
	    	
	    	///요일별 평균 위험운행행태
			makeHorizontalBarChart("chartDiv3", data3, "day");
	    	
	        /* 위험 운행행태 다발 구간 S */
	        //JSON 파싱
	        let dgrOprLcCn = safeParseJSON(list.dgrOprLcCn); 
	        
	        if(dgrOprLcCn.length > 0) {
		        let rowsHtml = ``;
		        let circles = [];
		        let locations = ``;
		        let dangers = ``;
		        
		        dgrOprLcCn.forEach((item) => {
		        	rowsHtml += `<tr>
					                <td>${item["순위"]}</td>
					                <td>${item["위치"]}</td>
					                <td>${formatNumber(item["건수"])}</td>
					                <td>${item["다발 운행행태"]}</td>
					            </tr>`;
					            
					//Leaflet Circle 추가
				    let circle = L.circle([item["위도"], item["경도"]], {
				        radius: 100,             // 반경(m 단위)
				        color: 'purple',          // 테두리 색
				        weight: 0,                // 테두리 두께
				        fillColor: 'magenta',     // 채우기 색
				        fillOpacity: 0.5          // 투명도
				    }).bindPopup(
				        `<b>순위:</b> ${item["순위"]}<br>
				         <b>위치:</b> ${item["위치"]}<br>
				         <b>건수:</b> ${formatNumber(item["건수"])}<br>
				         <b>다발 운행행태:</b> ${item["다발 운행행태"]}`
				    ).addTo(map);
				    
				    circles.push(circle);
				    
		        });
		        $("#dangerList").html(rowsHtml);
		        
		     	// 그룹으로 묶기
		        let group = L.featureGroup(circles);
		
		        // 모든 원이 다 보이도록 지도 줌/센터 자동 조정
		        map.fitBounds(group.getBounds());
			    
		     	// locations 생성
			    locations = dgrOprLcCn.map(item => item["위치"]).join(", ");
			 	// dangers 생성 (중복 제거)
			    let dangersArray = dgrOprLcCn.map(item => item["다발 운행행태"]);
			    let uniqueDangers = [...new Set(dangersArray)];
			    dangers = uniqueDangers.join(", ");
		        
		        let description2 = `<li><strong class="red_text">${locations}</strong>에서 ${dangers} 등의 위험 운전 행태가 반복적으로 관측되었습니다.</li>
		        					<li><strong class="blue_text">해당 구간에서 주의가 필요합니다.</strong></li>`;
		        $("#description2").html(description2);
	        }
	        /* 위험 운행행태 다발 구간 E */
	        
	        
	        /* 운행경과 시간별 위험운행분석 S */
	        //JSON 파싱
	        let oprTmDgrCn = safeParseJSON(list.oprTmDgrCn); 
	    	chartData.data4 = oprTmDgrCn;
	    	
	        if(oprTmDgrCn.length > 0) {
		        // 위험운행행태건수 기준 내림차순 정렬 후 상위 3개 추출
		        let oprTmDgrCnTop5 = oprTmDgrCn
			        .sort((a, b) => b["위험운행행태건수"] - a["위험운행행태건수"])
			        .slice(0, 3).map(item => item["time"]).join(", ");
		        //시간순 정렬
		        oprTmDgrCn.sort((a, b) => Number(a.time) - Number(b.time));
		        oprTmDgrCn.forEach(item => {
		            item.time = item.time + "시간";
		        });
		        makeLineChart("chartDiv4", oprTmDgrCn, "time");

								    <li>피로 · 집중력 저하 등으로 위험운행행태가 증가할 수 있으므로, 짧은 휴식 확보와 속도 · 차간거리 유지에 유의해주시기 바랍니다.</li>`;

	//안전점수 그래프 svg 애니메이션
	function runGauge($gaugeEl, newValue, duration = 500) {
	    const target = Math.max(0, Math.min(100, newValue));
	    const dur    = Math.max(200, duration);
	    const $bar   = $gaugeEl.find('.gauge-bar');
	    const $num   = $gaugeEl.find('.score b');
	    const C      = 2 * Math.PI * 50;
	
	    let start;
	    function animate(ts) {
	        if (!start) start = ts;
	        const p = Math.min(1, (ts - start) / dur);
	        const val = Math.round(target * p);
	
	        $bar.css('stroke-dashoffset', C * (1 - (val / 100)));
	        $num.text(val);
	
	        if (p < 1) requestAnimationFrame(animate);
	    }
	
	    requestAnimationFrame(animate);
	}
	
	// 필요할 때만 호출
	function updateGauge(selector, newValue, duration = 1000) {
	    const $g = $(selector).first(); // 첫 번째 요소만 선택
	    if ($g.length === 0) return;
	
	    $g.data('value', newValue);
	    runGauge($g, newValue, duration);
	}
	
	//XX분 -> XX시간 XX분
	function formatTimeFromMinutes(totalMinutes) {
	    // 올림/내림 방식은 필요에 따라 조정 가능
	    const hours = Math.floor(totalMinutes / 60);
	    const minutes = Math.round(totalMinutes % 60);
	    return `${hours}시간 ${minutes}분`;
	}
	
	//JSON 파싱 에러 처리
	function safeParseJSON(str) {
	    try {
	        return JSON.parse(str);
	    } catch (e) {
	        return [];
	    }
	}
	
	function makeCustomHorizontalBarChart(id, data, xKey = 'time', legendYn = 'N') {
		
	// 	console.log(data, xKey)
	    // 기존 차트가 있으면 제거
	    if (globalChartInstances[id]) {
	        globalChartInstances[id].root.dispose();
	        delete globalChartInstances[id];
	    }
	    
	    // 추가 안전장치: registry에서도 확인
	    if (am5.registry.rootElements[id]) {
	        am5.registry.rootElements[id].dispose();
	    }
	
	    // Root 생성
	    let root = am5.Root.new(id);
	
	    // 테마 설정
	    root.setThemes([am5themes_Animated.new(root)]);
	
	    // 차트 생성
	    let chart = root.container.children.push(am5xy.XYChart.new(root, {
	        panX: false,
	        panY: false,
	        paddingTop: 0,
		    paddingLeft: 0,
		    paddingRight: 0,
	    }));
	
	    // 데이터 처리 및 시리즈 정보 수집
	    let processedData = [];
	    let normalizedData = [];
	    let seriesInfo = new Set();
	    let originalValues = {}; // 원본 값 저장 (툴팁용)
	
	    // 1단계: 원본 데이터 처리 및 카테고리별 최대값 계산
	    data.forEach(item => {
	        let dataPoint = { category: item[xKey] };
	        let categoryValues = [];
	        
	        Object.keys(item).forEach(key => {
	            if (key !== xKey) {
	                const value = parseFloat(item[key]) || 0;
	                dataPoint[key] = value;
	                seriesInfo.add(key);
	                categoryValues.push(value);
	            }
	        });
	        
	        // 해당 카테고리의 최대값 계산
	        const maxValue = Math.max(...categoryValues);
	        dataPoint.maxValue = maxValue;
	        
	        processedData.push(dataPoint);
	    });
	
	    // 2단계: 정규화된 데이터 생성 (각 카테고리 내에서 0-100% 비율)
	    processedData.forEach(item => {
	        let normalizedPoint = { category: item.category };
	        const categoryMaxValue = item.maxValue;
	        
	        // 원본 값 저장
	        if (!originalValues[item.category]) {
	            originalValues[item.category] = {};
	        }
	        
	        Object.keys(item).forEach(key => {
	            if (key !== 'category' && key !== 'maxValue') {
	                const originalValue = item[key];
	                // 정규화: 해당 카테고리의 최대값을 100%로 변환
	                const normalizedValue = categoryMaxValue > 0 ? (originalValue / categoryMaxValue) * 100 : 0;
	                normalizedPoint[key] = normalizedValue;
	                
	                // 원본 값 저장 (툴팁용)
	                originalValues[item.category][key] = originalValue;
	            }
	        });
	        
	        normalizedData.push(normalizedPoint);
	    });
	
	//     console.log('백분율로 정규화된 데이터:', normalizedData);
	//     console.log('원본 값들:', originalValues);
	
	    // Y축: 카테고리축 (가로 막대 기준)
	    let yAxis = chart.yAxes.push(am5xy.CategoryAxis.new(root, {
	        categoryField: "category",
	        renderer: am5xy.AxisRendererY.new(root, {
	            cellStartLocation: 0.1,
	            cellEndLocation: 0.9,
	            minGridDistance: 1
	        }),
	    }));
	    
	    // Y축 색상을 라인과 동일하게 설정 및 크기 설정
	    yAxis.get("renderer").labels.template.setAll({
	        fontSize: 12,
			fontFamily: "Pretendard"
	    });
	    
	    yAxis.data.setAll(normalizedData);
	
	    let colorIndex = 0;
	    let seriesArray = [];
	
	    // 시리즈 생성
	    seriesInfo.forEach(sensorKey => {	
	    	
	        let currentColor = barColors[colorIndex % barColors.length];
	        
	        // X축: 값(ValueAxis) - 0-100% 범위로 고정
	        let xAxis = chart.xAxes.push(am5xy.ValueAxis.new(root, {
	            renderer: am5xy.AxisRendererX.new(root, { minGridDistance: 50 }),
	            min: 0,
	            max: 100 * 2.0 // 여유있게 2.0배
	        }));
	    	
	    	// X축 라벨 회전 및 크기 설정
	        xAxis.get("renderer").labels.template.setAll({
	            fontSize: 12,
				fontFamily: "Pretendard"
	        });
	
	    	// X축 그리드 제거
	    	xAxis.get("renderer").grid.template.setAll({
	    	    visible: false
	    	});
	
	        // X축 라벨에 % 표시 추가
	        xAxis.get("renderer").labels.template.adapters.add("text", function(text, target) {
	//             const value = target.dataItem ? target.dataItem.get("value") : 0;
	//             return value + "%";
	        	return "";
	        });
			
	        let series = chart.series.push(am5xy.ColumnSeries.new(root, {
	            name: sensorKey,
	            xAxis: xAxis,           // 값이 X축
	            yAxis: yAxis,           // 카테고리 Y축
	            valueXField: sensorKey,
	            categoryYField: "category"
	        }));
	        
	        // 커스텀 툴팁 생성 및 설정
	        let tooltip = am5.Tooltip.new(root, {
	            //getFillFromSprite: false,
	            labelText: "" // 빈 문자열로 설정, adapter에서 동적 생성
	        });
	        
	        // 툴팁 텍스트를 동적으로 생성
	        tooltip.label.adapters.add("text", function(text, target) {
	            const sprite = target.parent;
	            if (sprite && sprite.dataItem) {
	                const dataItem = sprite.dataItem;
	                const category = dataItem.get("categoryY");
	                const percentage = dataItem.get("valueX");
	                const originalValue = originalValues[category] && originalValues[category][sensorKey] 
	                    ? originalValues[category][sensorKey] 
	                    : 0;
	                
	                return `[bold]${category}[/]\n${sensorKey}: ${formatNumber(originalValue)}`;
	            }
	            return "";
	        });
	        
	        series.set("tooltip", tooltip);
	        
	        series.columns.template.setAll({
	            height: am5.percent(100), // 가로 막대 폭
	            strokeOpacity: 0
	        });
	
	        series.set("fill", currentColor);
	        series.set("stroke", currentColor);
	
	     	// ============ 불릿(값 표시) 추가 ============
		    series.bullets.push(function(root, series, dataItem) {
		        const value = dataItem.get("valueX") || 0;
		        const category = dataItem.get("categoryY");
		        const originalValue = originalValues[category] && originalValues[category][sensorKey]
		            ? originalValues[category][sensorKey]
		            : 0;
		
		        // 0일 때는 빈 텍스트 표시
		        if (originalValue === 0) {
		            return am5.Bullet.new(root, {
		                sprite: am5.Label.new(root, {
		                    text: "",
		                    visible: false
		                })
		            });
		        }
		
		        // 값 라벨 생성 (막대 오른쪽 끝 밖에 위치)
		        const valueLabel = am5.Label.new(root, {
		            text: formatNumber(originalValue), // 원본 값 표시
		            fill: am5.color("#333333"),
		            fontSize: 11,
		            //fontWeight: "bold",
		            centerY: am5.p50, // 세로 중앙 정렬
		            centerX: 0,       // 왼쪽 정렬 (막대 끝에서 시작)
		            paddingLeft: 8,   // 막대와의 간격
					fontFamily: "Pretendard"
		        });
		
		        return am5.Bullet.new(root, {
		            sprite: valueLabel,
		            locationX: 1, // 막대 끝에 위치
		            dynamic: true
		        });
		    });
	
	        seriesArray.push(series);
	        colorIndex++;
	        
	        // 첫 번째 라벨 숨기기 (데이터 설정 후)
	        xAxis.get("renderer").labels.template.adapters.add("visible", function(visible, target) {
	            const dataItem = target.dataItem;
	            if (dataItem && dataItem.get("value") === 0) {
	                return false;
	            }
	            return visible;
	        });
	    });
	
	    // 각 시리즈에 정규화된 데이터 설정
	    seriesArray.forEach(series => {
	        series.data.setAll(normalizedData);
	    });
	
	    // 커서 추가
	    let cursor = chart.set("cursor", am5xy.XYCursor.new(root, {
	        behavior: "zoomY"
	    }));
	    cursor.lineX.set("visible", false);
	
	    // 애니메이션 시작
	    seriesArray.forEach(series => {
	        series.appear(1000);
	    });
	    
	    if(legendYn == "Y") {
		    let legend = chart.children.push(am5.Legend.new(root, {
		        centerX: am5.p50,
		        x: am5.p50,
		    	y: am5.p100, // 하단으로 이동
		    	layout: root.horizontalLayout
		    }));
		    
		    legend.markers.template.setAll({
			    width: 12,   // 아이콘 가로
			    height: 12   // 아이콘 세로
			});
		    
		    legend.data.setAll(chart.series.values);
		    
		    legend.labels.template.setAll({
		        fontSize: 14,
				fontFamily: "Pretendard"
		    });
	    }
	    
	    chart.appear(1000, 100);
		
	    // 차트를 전역 변수에 저장
	    globalChartInstances[id] = {
	        chart: chart,
	        yAxis: yAxis,
	        root: root,
	        processedData: normalizedData,
	        originalValues: originalValues // 원본 값도 저장
	    };
	
	    // 차트 완성을 알리는 콜백 (선택적)
	    return new Promise((resolve) => {
	        // 애니메이션이 완료된 후 resolve
	        setTimeout(() => {
	            resolve({
	                chart: chart,
	                yAxis: yAxis,
	                root: root,
	                processedData: normalizedData,
	                originalValues: originalValues
	            });
	        }, 1100); // 애니메이션 시간보다 약간 길게
	    });
	}

	//pdf용 컨테이너(html clone)
	function clonePdfContainer(showYn) {
	    // 원본 요소 선택
	    const original = document.getElementById("container");
	    if (!original) return;
	
	    // 깊은 복사 (자식까지 모두 복사)
	    const clone = original.cloneNode(true);
	
	    // id 변경
	    clone.id = "container_pdf";
	
	    // 하위 요소 id에 "_pdf" 붙이기
	    const descendants = clone.querySelectorAll("[id]");
	    descendants.forEach(el => {
	        el.id = el.id + "_pdf";
	    });
	
	    // body에 추가
	    document.body.appendChild(clone);//주행 성능 분석
	    
	    $("#container_pdf").addClass("driving-report-pdf");
	    
	    //차트 로딩
	    $("#chartDiv1_pdf").empty();
	    $("#chartDiv2_pdf").empty();
	    $("#chartDiv3_pdf").empty();
	    $("#chartDiv4_pdf").empty();
	    $("#chartDiv5_pdf").empty();
	    
		makeCustomHorizontalBarChart("chartDiv1_pdf", chartData.data1, "metricName", "Y");
		pieChart("chartDiv2_pdf", chartData.data2, "구분");
		makeHorizontalBarChart("chartDiv3_pdf", chartData.data3, "day");
	    makeLineChart("chartDiv4_pdf", chartData.data4, "time");
	    makeVerticalBarChart("chartDiv5_pdf", chartData.data5, "day");
	}
