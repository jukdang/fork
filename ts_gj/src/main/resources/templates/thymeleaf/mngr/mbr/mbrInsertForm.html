<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:replace="/layout/head :: head-admin"></th:block>
	<script th:src="@{/js/egovframework/pswdToggle.js}"></script>
</head>
<body>
	<!-- wrap : S -->
    <div class="wrap admin" id="wrap">
    	<!-- 상단 헤더 -->
    	<th:block th:replace="/layout/header :: left-menu-admin"></th:block>
	
	   	<!-- container : S -->
		<div id="container" class="scrollBar">
		    <div class="contents member_update">
		    	<div class="wrapper">
		    	
			    	<div class="tit_wrap">
						<h1>계정 생성</h1>
					</div>
				    
				    	
			        <!-- 에러 메시지 표시 -->
			        <div th:if="${error}" class="alert">
			            <span th:text="${error}"></span>
			        </div>
			        
			        <!-- 회원가입 폼 : S -->
			        	<!-- <div class="disbetween">
						    <h2>회원정보 등록</h2>
						    <em class="point">*필수 입력 사항</em>
					    </div> -->
	
			        <form th:action="@{/mngr/mbr/mbrInsert}" th:object="${mbrVO}" method="post">
				        <div class="wh_box">
				            <dl>
							    <dt><label for="mbrId">아이디<em class="point">*</em></label></dt>
							    <dd>
							    	<div class="id_check">
								        <input type="text" th:field="*{mbrId}" id="mbrId" placeholder="아이디를 입력해주세요.">
								        <button type="button" class="btn mid scolor" id="chkMbrId">중복확인</button>
							        </div>
							        <p id="mbrIdChkRslt" class="form-text alert_error" style="display: none;"></p>
						    		<div class="alert_error" th:if="${#fields.hasErrors('mbrId')}" th:errors="*{mbrId}"></div>
							    </dd>
							</dl>
	
			            	<dl>
				                <dt><label for="mbrPswd">비밀번호<em class="point">*</em></label></dt>
				                <dd>
					                <div class="pass_input">
					                	<input type="password" th:field="*{mbrPswd}" id="mbrPswd" placeholder="비밀번호를 입력해주세요.">
						                <span class="icon_view">
						                <!-- 비밀번호 표시 -->
										    <i class="fa-regular fa-eye" style="display: none;"></i>
										    <!-- 비밀번호 표시안함 -->
										    <i class="fa-regular fa-eye-slash"></i>
									    </span>
					                </div>
					                <div class="alert_error" th:if="${#fields.hasErrors('mbrPswd')}" th:errors="*{mbrPswd}"></div>
				                </dd>
			                </dl>
	
			            	<dl>
				                <dt><label for="confirmPswd">비밀번호 확인<em class="point">*</em></label></dt>
				                <dd>
					                <div class="pass_input">
						                <input type="password" id="confirmPswd" name="confirmPswd" placeholder="비밀번호를 다시 입력해주세요.">
						                <span class="icon_view">
						                <!-- 비밀번호 표시 -->
										    <i class="fa-regular fa-eye" style="display: none;"></i>
										    <!-- 비밀번호 표시안함 -->
										    <i class="fa-regular fa-eye-slash"></i>
									    </span>
								    </div>
							    </dd>
						    </dl>
	
			            	<dl>
				                <dt><label for="mbrNm">이름<em class="point">*</em></label></dt>
				                <dd><input type="text" th:field="*{mbrNm}" id="mbrNm" placeholder="이름을 입력해주세요."><div class="alert_error" th:if="${#fields.hasErrors('mbrNm')}" th:errors="*{mbrNm}"></div></dd>
			                </dl>
			            	<dl>
			            		<dt><label for="mbrRole">회원 역할<em class="point">*</em></label></dt>
			            		<dd>
							    	<div>
									    <select th:field="*{mbrRole}" class="form-control" id="mbrRole" onchange="toggleOwnrNm()">
									        <option th:if="${isAdmin}" value="ROLE_ADMIN">시스템 관리자</option>
									        <option value="ROLE_MANAGER">관리자</option>
									        <option value="ROLE_MECHANIC">정비사</option>
									    </select>
							    	</div>
							    	<div class="alert_error" th:if="${#fields.hasErrors('mbrRole')}" th:errors="*{mbrRole}"></div>
						    	</dd>
						    </dl>
							<dl id="ownrNmSection" th:if="${isAdmin}">
			            		<dt><label for="ownrNm">소속<em class="point">*</em></label></dt>
			            		<dd>
							    	<div>
									    <select th:field="*{ownrNm}" class="form-control">
									    	<option value="">선택하세요</option>
									    	<option value="대원버스">대원버스</option>
									    	<option value="대진운수">대진운수</option>
									    	<option value="대창운수">대창운수</option>
									    	<option value="동화운수">동화운수</option>
									    	<option value="라정시내">라정시내</option>
									    	<option value="삼아교통">삼아교통</option>
									    	<option value="삼원운수">삼원운수</option>
									    	<option value="세영운수">세영운수</option>
									    	<option value="을로운수">을로운수</option>
									    	<option value="현대교통">현대교통</option>
									    </select>
								    </div>
						    	</dd>
						    </dl>
						    <div th:unless="${isAdmin}">
							    <input type="hidden" name="ownrNm" id="ownrNm" th:value="${currentOwnrNm}">
							</div>
				        </div>
			            
			            <!-- 버튼 영역 -->
			            <div class="button_area">
			                <a th:href="@{/mngr/mbr/mbrList}" class="btn mid grey">취소</a>
			               	<button type="submit" class="btn mid mcolor">등록</button>
			            </div>
			        </form>
			        <!-- 회원가입 폼 : E -->
			    
			    </div>
		    </div>
		    
		    <!-- 푸터 -->
    		<th:block th:replace="/layout/footer :: footer-simple"></th:block>
	    </div>
		<!-- container : E -->
	</div>
	<!-- wrap : E -->
    
    <script>
	    $(document).ready(function() {
	    	toggleOwnrNm();
	        var idChecked = false; // 아이디 중복 확인 여부
	
	        // 아이디 중복 확인
	        $("#chkMbrId").click(function() {
	            var mbrId = $("#mbrId").val();
	            
	            if (mbrId.length < 4) {
	                $("#mbrIdChkRslt").text("아이디는 최소 4자 이상이어야 합니다.").css("color","#d05050").show();
	                idChecked = false;
	                return;
	            }
	            
	            customFetch({
	                url: '/mbr/chkMbrId',
	                method: 'POST',
	                params: {
	                	mbrId: mbrId
	                },
	                headers: {
	                    'Content-Type': 'application/x-www-form-urlencoded'
	                },
	                loadingId: 'connUserCntBox', // 로딩을 표시할 요소 ID
	                onSuccess: function(response) {
	                	if (response == 0) {
	                        $("#mbrIdChkRslt").text("사용 가능한 아이디입니다.").css("color", "#1a971f").show();
	                        idChecked = true;
	                    } else {
	                        $("#mbrIdChkRslt").text("이미 사용 중인 아이디입니다.").css("color","#d05050").show();
	                        idChecked = false;
	                    }
	                },
	                onError: function(error) {
	                	$("#mbrIdChkRslt").text("서버 오류가 발생했습니다.").css("color","#d05050").show();
	                    idChecked = false;
	                }
	            });
	            
	        });
	        
	        // 도메인 선택 시 자동 입력
	        $("#domainSelect").change(function() {
	            $("#emailDomain").val($(this).val());
	        });
	
	        // 폼 제출 전 유효성 검사
	        $("form").submit(function(e) {
	            var password = $("#mbrPswd").val();
	            var confirmPassword = $("#confirmPswd").val();
	            
	            // 1. 아이디 중복 체크 안 했으면 막기
	            if (!idChecked) {
	                e.preventDefault();
	                alert("아이디 중복 확인을 해주세요.");
	                return false;
	            }
	            
	            // 2. 비밀번호랑 비밀번호 확인이 다르면 막기
	            if (password !== confirmPassword) {
	                e.preventDefault();
	                alert("비밀번호와 비밀번호 확인이 일치하지 않습니다.");
	                return false;
	            }
	            
	            // 3. 이메일 조합 처리
	            var emailId = $("#emailId").val().trim();
	            var emailDomain = $("#emailDomain").val().trim();
	            
	            // 이메일이 모두 입력된 경우만 조합
	            if (emailId && emailDomain) {
	                $("#mbrEmail").val(emailId + '@' + emailDomain);
	            } else if (emailId || emailDomain) {
	                // 둘 중 하나만 입력된 경우
	                e.preventDefault();
	                alert("이메일 아이디와 도메인을 모두 입력해주세요.");
	                return false;
	            }
	            
	            return true;
	        });
	    });
	    
	    $("#mbrTelNo").on("input", function () {
	        let value = $(this).val();
	        // 숫자 이외 문자 제거
	        value = value.replace(/[^0-9]/g, "");
	        $(this).val(value);
	    });
	    
	    function toggleOwnrNm() {
    	   const mbrRole = document.getElementById('mbrRole').value;
    	   const ownrNmSection = document.getElementById('ownrNmSection');

    	   if (mbrRole === 'ROLE_ADMIN') {
    	       //ownrNmSection.style.display = 'none';
    	       $("#ownrNmSection").hide();
    	       // 시스템 관리자일 때 소속 값 초기화 (선택사항)
    	       $("#ownrNm").val('');
    	   } else {
    		   $("#ownrNmSection").show();
    	   }
    	}
    </script>

</body>
</html>
