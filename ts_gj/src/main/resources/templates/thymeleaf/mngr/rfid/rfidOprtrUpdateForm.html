<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:replace="/layout/head :: head-admin"></th:block>
	<script th:src="@{/js/egovframework/pswdToggle.js}"></script>
</head>
<body>
	<!-- wrap : S -->
    <div class="wrap admin" id="wrap">
    	<!-- 상단 헤더 -->
    	<th:block th:replace="/layout/header :: left-menu-admin"></th:block>
	
	   	<!-- container : S -->
		<div id="container" class="scrollBar">
		    <div class="contents member_update">
		    	<div class="wrapper">
		    	
			    	<div class="tit_wrap">
						<h1 th:text="${pageInfo.pageTitle}"></h1>
					</div>
	
			        <form th:action="@{/mngr/rfidOprtrUpdate}" method="post">
				        <div class="wh_box">
				        	<dl>
				        		<dt><label for="oprtrId">운전원 아이디<em class="point">*</em></label></dt>
							    <dd>
							    	<div class="id_check">
							    		<input type="hidden" id="ownrNm" name="ownrNm" th:value="${result.ownrNm}">
								        <input type="text" id="oprtrId" name="oprtrId" th:value="${result.oprtrId}" readOnly>
							        </div>
							    </dd>
				        	</dl>
				            <dl>
							    <dt><label for="oprtrNm">운전원명<em class="point">*</em></label></dt>
							    <dd>
							    	<div class="id_check">
								        <input type="text" id="oprtrNm" name="oprtrNm" th:value="${result.oprtrNm}">
							        </div>
							    </dd>
							</dl>
				            <dl>
							    <dt><label for="rfidNo">RFID 카드 아이디<em class="point">*</em></label></dt>
							    <dd>
							    	<div class="id_check">
								        <input type="text" id="rfidNo" name="rfidNo" th:value="${result.rfidNo}">
								        <button type="button" class="btn mid scolor" id="chkRfidNo">중복확인</button>
							        </div>
							        <p id="rfidNoChkRslt" class="form-text alert_error"></p>
							    </dd>
							</dl>
						</div>
			            
			            <!-- 버튼 영역 -->
			            <div class="btn_area jfcenter">
			                <a th:href="@{/mngr/rfidManage}" class="btn mid grey">취소</a>
			               	<button type="submit" class="btn mid mcolor">수정</button>
			            </div>
			        </form>
			        <!-- 회원가입 폼 : E -->
			    
			    </div>
		    </div>
		    
		    <!-- 푸터 -->
    		<th:block th:replace="/layout/footer :: footer-simple"></th:block>
	    </div>
		<!-- container : E -->
	</div>
	<!-- wrap : E -->
    
    <script>
	    $(document).ready(function() {
	        var idChecked = true; // 아이디 중복 확인 여부
	        const originalValue = $("#rfidNo").val();
	        $("#chkRfidNo").hide();
	        $("#rfidNo").on("input", function() {
	            if ($(this).val() === originalValue) {
	                idChecked = true;
	                $("#chkRfidNo").hide();
	            } else {
	                idChecked = false;
	                $("#chkRfidNo").show();
	            }
	            if($(this).val() === ''){
	            	idChecked = true;
	                $("#chkRfidNo").hide();
	            }
	            console.log("idChecked =", idChecked);
	        });
	        // 아이디 중복 확인
	        $("#chkRfidNo").click(function() {
	            var rfidNo = $("#rfidNo").val();
	            if (rfidNo.length < 1) {
	                $("#rfidNoChkRslt").text("RFID를 입력해주세요.").css("color","#d05050");
	                idChecked = false;
	                return;
	            }
	            
	            customFetch({
	                url: '/mngr/chkRfidNo',
	                method: 'POST',
	                params: {
	                	rfidNo: rfidNo
	                },
	                headers: {
	                    'Content-Type': 'application/x-www-form-urlencoded'
	                },
	                loadingId: 'connUserCntBox', // 로딩을 표시할 요소 ID
	                onSuccess: function(response) {
	                	console.log(response.data.list)
	                	var data = response.data.list;
	                	if (data == 0) {
	                        $("#rfidNoChkRslt").text("사용 가능한 아이디입니다.").css("color", "#1a971f");
	                        idChecked = true;
	                    } else {
	                        $("#rfidNoChkRslt").text("이미 사용 중인 아이디입니다.").css("color","#d05050");
	                        idChecked = false;
	                    }
	                },
	                onError: function(error) {
	                	$("#rfidNoChkRslt").text("서버 오류가 발생했습니다.").css("color","#d05050");
	                    idChecked = false;
	                }
	            });
	            
	        });
	
	        // 폼 제출 전 유효성 검사
	        $("form").submit(function(e) {
	            var oprtrNm = $("#oprtrNm").val();
	            var ownrNm = $("#ownrSelect").val();
	            
	            if(!oprtrNm){
	            	alert("운전원명을 입력해주세요.");
	                return false;
	            }
	            
	            if (!idChecked) {
	                e.preventDefault();
	                alert("RFID 중복 확인을 해주세요.");
	                return false;
	            }
	            
	            return true;
	        });
	    });
    </script>

</body>
</html>
