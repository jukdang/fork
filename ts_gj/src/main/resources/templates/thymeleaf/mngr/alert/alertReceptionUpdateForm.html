<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
	<th:block th:replace="/layout/head :: head-admin"></th:block>
</head>
<body>
	<!-- wrap : S -->
    <div class="wrap" id="wrap">
    
        <!-- 상단 헤더 -->
        <div th:replace="/layout/header :: left-menu-admin"></div>
	        
	    <!-- container : S -->
		<div id="container" class="scrollBar">
	        <!-- 알림 수신정보 수정 -->
	        <div class="contents member_update">
				<div class="wrapper">
					<div class="tit_wrap">
						<h1>알림 수신 정보 수정</h1>
					</div>
			        <form th:action="@{/mngr/alertReceptionUpdate}" method="post">
				        <!-- 회원정보 수정 폼 -->
				        <input type="hidden" name="rcvrSn" th:value="${recipient.rcvrSn}">
				        <div class="wh_box">
				        	<dl th:style="${dataFilter == 'all'} ? 'display: flex;' : 'display: none;'">
				        		<dt><label>운수회사</label></dt>
							    <dd>
							    	<div>
							    		<div th:replace="/common/ownrSelect :: mngr-select"></div>
							        </div>
							    </dd>
				        	</dl>
				            <dl>
							    <dt><label>전화번호</label></dt>
							    <dd>
							    	<div>
								        <input type="text" id="telno" name="telno" placeholder="전화번호를 입력해주세요." th:value="${recipient.telno}" maxlength="13">
							        </div>
							    </dd>
							</dl>
				            <dl>
							    <dt><label>알림 종류</label></dt>
							    <dd>
							    	<div class="checkbox_wrap">
							    		<div class="checkbox_area">
											<label><input type="checkbox" id="chckRcptnYn" name="chckRcptnYn" value="Y" th:checked="${recipient.chckRcptnYn == 'Y'}"><span>차량 진단 알림</span></label>
										</div>
										<div class="checkbox_area">
											<label><input type="checkbox" id="aiRptRcptnYn" name="aiRptRcptnYn" value="Y" th:checked="${recipient.aiRptRcptnYn == 'Y'}"><span>AI 리포트 알림</span></label>
										</div>
							        </div>
							    </dd>
							</dl>
						</div>
						<div class="button_area">
			                <a th:href="@{/mngr/alertManage}" class="btn mid grey">취소</a>
			               	<button type="button" id="modifyBtn" class="btn mid mcolor">수정</button>
			            </div>
		            </form>
			    </div>
		    </div>
	        
	        
	        <!-- 푸터 -->
		    <th:block th:replace="/layout/footer :: footer-simple"></th:block>
	    
	    <!-- <p>유저 아이디: <span sec:authentication="name"></span></p> -->
	    </div>
		<!-- container : E -->
	</div>
	<!-- wrap : E -->
<script>
$(document).ready(function() {
});

//폼 제출 전 유효성 검사
$('#modifyBtn').on('click', function(e) {
    var ownrNm = $("#ownrSelect").val();
    if(ownrNm == 'all'){
        alert('운수회사를 선택하세요.');
        return false;
    }
    
    // 전화번호 유효성 검사 추가
    var telNo = $("#telno").val();
    var phonePattern = /^\d{3}-\d{4}-\d{4}$/;
    
    if(!telno) {
        alert('전화번호를 입력해주세요.');
        return false;
    }
    
    if(!phonePattern.test(telno)) {
        alert('전화번호는 000-0000-0000 형식으로 입력해주세요.');
        return false;
    }
    
    $("form").submit();
});
</script>
</body>
</html>
